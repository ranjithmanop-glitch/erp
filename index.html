 const foot=`<tr style="background:#f2f0fa"><td></td><td><button type="button" class="addb" onclick="orAddRow(${g},'i')">+ Item</button></td><td><button type="button" class="addb" onclick="orAddRow(${g},'b')">+ Package</button></td><td><button type="button" class="addb" onclick="orAddRow(${g},'n')">+ No. of Bags</button></td><td><b id="orgt_${g}">${n0(gTons(g))}</b> <small>T</small></td><td colspan="2"></td></tr>`;
 return `<div class="card" style="margin:10px 0;background:#fafaff"><div class="pagehead" style="margin:0 0 6px"><b>Customer ${gi+1}</b>${gids().length>1?`<button type="button" class="danger" onclick="orDel(${g})">✕ Remove</button>`:''}</div>
<div class="formgrid"><div class="field"><label>Party Name *</label><div class="inl"><input list="dl_orp" value="${esc(f.l.party)}" placeholder="Select from master" autocomplete="off" oninput="orSet(${f.i},'party',this.value)"><button type="button" class="addb" onclick="orAddParty(${f.i})">+<br>Add</button></div></div></div>
<div class="tablewrap"><table><tr><th>#</th><th>Item Name *</th><th>Package – KG *</th><th>No. of Bags *</th><th>Tons (auto)</th><th>Remarks</th><th></th></tr>${rows}${foot}</table></div></div>`};

window.orSet=(i,k,v)=>{const l=OR.lines[i];l[k]=v;const T=()=>{const b=document.getElementById('orTot');if(b)b.innerHTML=totHtml()};

window.orAdd=()=>{const g=Math.max(0,...OR.lines.map(l=>l.g||0))+1;OR.lines.push({g,party:'',item:'',bagKg:OR.lines.length?OR.lines[OR.lines.length-1].bagKg:'',bags:'',remarks:''});orRender()};

 f('Customer Name *','oc_name','e.g. KAVYA TRADERS','style="width:100%;box-sizing:border-box;border:2px solid #17a34a;border-radius:10px;padding:11px 12px;font-size:15px;text-transform:uppercase"')+f('City','oc_city','e.g. MADURAI','style="width:100%;box-sizing:border-box;border:1px solid #d3e4d9;border-radius:10px;padding:11px 12px;font-size:15px;text-transform:uppercase"')+f('Address','oc_addr','Optional')+f('Contact Number','oc_mob','10-digit mobile (optional)','type="tel" inputmode="numeric" maxlength="15" style="width:100%;box-sizing:border-box;border:1px solid #d3e4d9;border-radius:10px;padding:11px 12px;font-size:15px"')+f('GST Number','oc_gst','Optional','maxlength="15" style="width:100%;box-sizing:border-box;border:1px solid #d3e4d9;border-radius:10px;padding:11px 12px;font-size:15px;text-transform:uppercase"')+

 '<div class="card" style="margin-top:16px"><div class="pagehead" style="margin:0"><h2 style="margin:0">Recent Customer Orders</h2><div class="actions" style="margin:0"><button class="secondary" onclick="orListPdf()">🖨 PDF (All)</button><button class="secondary" onclick="orListXls()">📊 Excel (All)</button></div></div>'+
 tbl(['Order No','Serial No','Order Date','Customers','Bags','Total Tons','Remarks','By','Actions'],rows)+'</div>'+del};

<script>

 let added=0,updated=0;
 L.forEach(({x,k})=>{

 Q('slines').innerHTML=sRows();slCalc();
 msg(i,'✓ '+o.no+' → '+(added?added+' line(s) added':'')+(added&&updated?', ':'')+(updated?updated+' line(s) refreshed':'')+' · '+c+'. Now enter Rate (₹), Batch, Location.')};

const PANRE=/^[A-Z]{5}\d{4}[A-Z]$/,IFSCRE=/^[A-Z]{4}0[A-Z0-9]{6}$/,PHRE=/^\+?\d{10,13}$/;

/* menu: top-level "Outward ▾" next to Inward → New Sale Order · Confirm Sale Order · Pending Orders · Transport; Sales keeps Sales Bills + Sales Summary */
if(!NAV.includes('Outward'))NAV.splice(NAV.indexOf('Inward')>=0?NAV.indexOf('Inward')+1:NAV.indexOf('Purchase'),0,'Outward');

let TD=blank();

 [['driver','driver'],['driverContact','contact'],['rcNo','rcNo'],['pan','pan'],['bankHolder','bankHolder'],['bankName','bankName'],['bankAcc','bankAcc'],['bankIfsc','bankIfsc']].forEach(([a,b])=>{if(!TD[a]&&m[b])TD[a]=m[b]});
 if(!TD.owner&&m.owner)TD.owner=m.owner;if(!TD.ownerContact&&m.ownerContact)TD.ownerContact=m.ownerContact};

const locs=()=>(db.locations=db.locations||[]);
const dists=()=>(db.distances=db.distances||[]);

let PRE=null;const LS={cfm:new Set(),pend:new Set(),tr:new Set()};
const lst=(o,l)=>l.st||(o.conf?'conf':'new');
const lkey=(o,i)=>o.no+'|'+i;
const lget=k=>{const j=k.lastIndexOf('|'),o=ordOf(k.slice(0,j)),i=+k.slice(j+1);return o&&o.lines[i]?{o,l:o.lines[i],i,k}:null};

const billed=(t,c)=>(db.sales||[]).some(b=>b.party===c&&String(b.orders||'').split(',').map(x=>x.trim()).some(n=>tOrders(t).includes(n))&&vn(b.vehicle)===vn(t.vehicle));
const pendingRows=()=>{const R=[];trans().filter(t=>t.weigh).forEach(t=>{tParties(t).forEach(c=>{if(!billed(t,c))R.push({t,c})})});return R};
const tStatus=t=>{const ps=tParties(t);if(t.weigh)return ps.length&&ps.every(c=>billed(t,c))?'<span class="apv g">🧾 Billed</span>':'<span class="apv g">⚖ Weighed → Production → Sales</span>';return t.status==='OK'?'<span class="apv g">✔ OK → Weigh Bridge</span>':'<span class="apv">Draft</span>'};
const lnInfoText=set=>{const ks=[...LS[set]].map(lget).filter(Boolean);return ks.length+' selected · '+n0(ks.reduce((a,x)=>a+(+x.l.bags||0),0))+' bags · '+n0(ks.reduce((a,x)=>a+(+x.l.tons||0),0))+' T'};

 '<div class="tablewrap"><table><tr><th>Serial No.</th><th>Order No.</th><th>Order Date</th><th>Customer</th><th>Item</th><th style="text-align:right">KG</th><th style="text-align:right">No. of Bags</th><th style="text-align:right">Tons</th><th>Remarks</th><th style="width:60px;text-align:center">Select <input type="checkbox" class="lnAll_'+set+'" style="width:auto" onclick="lnAll(\''+set+'\',this.checked)" title="Select all"></th>'+(set!=='tr'?'<th>Actions</th>':'')+'</tr>'+
 X.map(x=>'<tr class="ln_'+set+'" data-s="'+esc((x.o.no+' '+(x.o.csn||'')+' '+x.l.party+' '+x.l.item).toLowerCase())+'"><td><b style="color:#522295">'+esc(x.o.csn||'')+'</b></td><td><b>'+esc(x.o.no)+'</b></td><td>'+esc(x.o.date)+'</td><td>'+esc(x.l.party)+'</td><td>'+esc(x.l.item)+'</td><td style="text-align:right">'+n0(x.l.bagKg)+'</td><td style="text-align:right">'+n0(x.l.bags)+'</td><td style="text-align:right">'+n0(x.l.tons)+'</td><td>'+esc(x.l.remarks||'')+'</td><td style="text-align:center"><input type="checkbox" style="width:auto" data-k="'+esc(x.k)+'" '+(LS[set].has(x.k)?'checked ':'')+'onclick="lnTog(\''+set+'\',this.dataset.k,this.checked)"></td>'+(set!=='tr'?'<td><button type="button" class="secondary" onclick="pnEdit('+x.o.id+')">✎ Edit</button></td>':'')+'</tr>').join('')+'</table></div>'+(X.length?'':'<p class="muted">No lines here.</p>')};
const addLoc=n=>{n=String(n||'').trim().toUpperCase();if(n&&!locs().some(x=>String(x.name).toUpperCase()===n))locs().push({name:n})};
window.trTab=t=>{TT=t;TE=null;if(t==='out')window.wbTab('out');else{window.wbTab('in')}};

window.trDel=id=>{

 const t=trans().find(x=>x.id===id);if(!t)return;

 if(!confirm('DELETE transport entry '+(t.no||'')+' ('+t.orderNo+' · '+t.vehicle+') ?\n\nIts customer lines go back to the Transport list.'))return;
 allLines().forEach(x=>{if(x.l.tr===id)delete x.l.tr});

 if(pan&&!PANRE.test(pan)){alert('PAN must be 10 characters like ABCDE1234F (or leave blank).');return null}

 if(TD.freight!==''&&!(+TD.freight>=0)){alert('Enter a valid Freight amount.');return}

(()=>{

 const a=adv(id);if(!a||a.status==='Rejected')return;
 const r=prompt('Reason for rejecting Payment Advice '+a.id+' (required):');if(r===null)return;
 if(!r.trim()){alert('A reason is required to reject.');return}
 a.rejBills=a.bills||[];a.bills=[];a.status='Rejected';a.rejReason=r.trim();a.rejBy=current.id;a.rejAt=nowS();
 audit('Reject payment advice',a.id+' · '+a.vendor+' · '+r.trim());save();alert(a.id+' rejected. Its bills are free again – you can generate a new Payment Advice for them.');render()};
window.advReopen=id=>{
 if(!canMgr()){alert('Only Manager / Admin can reopen.');return}
 const a=adv(id);if(!a||a.status!=='Rejected')return;
 const used=new Set(db.advices.filter(x=>x!==a).flatMap(x=>x.bills||[])),bl=(a.rejBills||[]);
 if(bl.some(b=>used.has(b))){alert('Some bills of this advice are already in another Payment Advice, so it cannot be reopened.');return}
 if(!confirm('Reopen '+a.id+'?'))return;
 a.bills=bl;delete a.rejBills;delete a.status;delete a.rejReason;delete a.rejBy;delete a.rejAt;
 audit('Reopen payment advice',a.id);save();render()};
window.advDelete=id=>{
 if(!canMgr()){alert('Only Manager / Admin can delete a Payment Advice.');return}
 const a=adv(id);if(!a)return;
 if(!confirm('DELETE Payment Advice '+a.id+' ('+a.vendor+')?\n\nIts bills become free to use in a new advice.'))return;
 (db.advTrash=db.advTrash||[]).unshift({at:nowS(),by:current.id,advice:JSON.parse(JSON.stringify(a))});
 db.advices=db.advices.filter(x=>x!==a);audit('Delete payment advice',a.id+' · '+a.vendor);save();render()};

/* numbering must never repeat after a delete: PA-<highest>+1 */

 if(mx<=len)return _G.apply(this,arguments);
 const ph=[];for(let i=0;i<mx-len;i++)ph.push({id:'PA-'+i+'x',bills:[],total:0,net:0,ded:0,comm:0,vendor:'',__ph:1});

<script>
/* ===== V33: Vehicle details + documents INSIDE the Transport entry (no separate screen) · View / Replace / Download / Print / PDF for every document ·
   Weigh Bridge Outward = only the requested fields, vehicle number comes automatically from Transport OK · documents visible in Weigh Bridge · final check + Approve ===== */
(()=>{
const vn=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const vehs=()=>(db.vehicles=db.vehicles||[]);
const vMeta=v=>{const k=vn(v);return k?vehs().find(x=>vn(x.name)===k):null};
const vMake=v=>{let m=vMeta(v);if(!m){m={name:String(v).trim().toUpperCase()};vehs().push(m)}return m};
const hasDoc=(v,t)=>{const m=vMeta(v);return !!(m&&m.docs&&m.docs[t])};
const canDel=()=>!!current&&(current.role==='Admin'||current.role==='Manager');
const nowS=()=>new Date().toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});
const fsz=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const n0=n=>(+n||0).toLocaleString('en-IN',{maximumFractionDigits:3});
const PANRE=/^[A-Z]{5}\d{4}[A-Z]$/,IFSCRE=/^[A-Z]{4}0[A-Z0-9]{6}$/,PHRE=/^\+?\d{10,13}$/;
const DT=[['rc','Vehicle RC',1],['pan','PAN Card',0],['bank','Bank Passbook',0],['tds','TDS Form',0],['other','Other Document',0]];
const DL={rc:'Vehicle RC',pan:'PAN Card',bank:'Bank Passbook',tds:'TDS Form',other:'Other Document'};
const trans=()=>db.transports||[];
const tLines=t=>t.lines||[];
const tParties=t=>[...new Set(tLines(t).map(l=>l.party))];
const tTons=t=>+tLines(t).reduce((a,l)=>a+(+l.tons||0),0).toFixed(3);
const reqKg=t=>+(tTons(t)*1000).toFixed(2);
const csnOf=t=>[...new Set(tLines(t).map(l=>{const o=(db.orders||[]).find(x=>x.no===l.o);return o&&o.csn}).filter(Boolean))].join(', ');
const TOLKG=100;
const sameKg=(a,b)=>Math.abs(a-b)<=TOLKG+1e-6;
const dTxt=(net,req)=>{const d=+(net-req).toFixed(2);return d===0?'Exact':(d>0?'Excess +':'Short −')+n0(Math.abs(d))+' KG'};
const dTag=(t,x)=>{const rq=reqKg(t);if(!(rq>0))return '';const nt=(+x.gross||0)-(+x.tare||0);return '<br><small style="color:'+(sameKg(nt,rq)?'#067647':'#b42318')+'">'+dTxt(nt,rq)+' vs Transport</small>'};

/* ---------- document files: same IndexedDB store as before (key = vehicle|type) ---------- */
const idb2=()=>new Promise((res,rej)=>{const r=indexedDB.open('tsr_erp_docs',1);r.onupgradeneeded=()=>r.result.createObjectStore('d',{keyPath:'k'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(mode,fn)=>{const d=await idb2();return new Promise((res,rej)=>{const t=d.transaction('d',mode);const q=fn(t.objectStore('d'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const dPut=o=>tx('readwrite',s=>s.put(o)),dGet=k=>tx('readonly',s=>s.get(k));
const shrink=f=>new Promise(res=>{
 if(!/^image\//.test(f.type)||f.size<700*1024)return res(f);
 const img=new Image(),u=URL.createObjectURL(f);
 img.onload=()=>{const s=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  c.toBlob(b=>{URL.revokeObjectURL(u);res(b&&b.size<f.size?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f)},'image/jpeg',.82)};
 img.onerror=()=>{URL.revokeObjectURL(u);res(f)};img.src=u});
const putDoc=async(veh,type,file)=>{
 if(!/^(image\/|application\/pdf)/.test(file.type)&&!/\.(pdf|png|jpe?g)$/i.test(file.name)){alert('Only PNG, JPG, JPEG or PDF files are allowed.');return false}
 file=await shrink(file);
 if(file.size>10*1048576){alert('File is too large (max 10 MB).');return false}
 const m=vMake(veh);
 await dPut({k:vn(veh)+'|'+type,blob:file,name:file.name,mime:file.type||'application/octet-stream'});
 m.docs=m.docs||{};m.docs[type]={name:file.name,size:file.size,mime:file.type,at:nowS()};
 audit('Vehicle document uploaded',m.name+' · '+type);save();return true};

/* ---------- download / print / PDF helpers ---------- */
const dlBlob=(blob,name)=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)};
const dataUrl=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)});
const toJpeg=blob=>new Promise((res,rej)=>{const u=URL.createObjectURL(blob),im=new Image();
 im.onload=()=>{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0);URL.revokeObjectURL(u);
  c.toBlob(async b=>{if(!b)return rej(new Error('jpeg'));res({bytes:new Uint8Array(await b.arrayBuffer()),w:c.width,h:c.height})},'image/jpeg',.92)};
 im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u});
const imgPdf=async blob=>{
 const j=await toJpeg(blob),land=j.w>j.h,PW=land?841.89:595.28,PH=land?595.28:841.89,M=28,s=Math.min((PW-2*M)/j.w,(PH-2*M)/j.h),dw=j.w*s,dh=j.h*s,x=(PW-dw)/2,y=(PH-dh)/2;
 const enc=new TextEncoder(),parts=[],offs=[];let len=0;
 const put=d=>{const u=typeof d==='string'?enc.encode(d):d;parts.push(u);len+=u.length};
 const obj=(id,body)=>{offs[id]=len;put(id+' 0 obj\n'+body+'\nendobj\n')};
 put('%PDF-1.4\n');
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
 obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW.toFixed(2)+' '+PH.toFixed(2)+'] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>');
 const cs='q '+dw.toFixed(2)+' 0 0 '+dh.toFixed(2)+' '+x.toFixed(2)+' '+y.toFixed(2)+' cm /Im0 Do Q';
 obj(4,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
 offs[5]=len;put('5 0 obj\n<< /Type /XObject /Subtype /Image /Width '+j.w+' /Height '+j.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.bytes.length+' >>\nstream\n');put(j.bytes);put('\nendstream\nendobj\n');
 const xr=len;put('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<6;i++)put(String(offs[i]).padStart(10,'0')+' 00000 n \n');
 put('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
 return new Blob(parts,{type:'application/pdf'})};
const safe=s=>String(s||'').replace(/[^A-Za-z0-9._-]+/g,'_');

/* ---------- the document panel (used in Transport entry and in Weigh Bridge) ---------- */
const BOX={
 tdocbox:()=>{const e=document.querySelector('input[list="dl_trveh"]');return e?e.value:''},
 wdocbox:()=>{const e=document.getElementById('wveh');return e?e.value:''}};
const panelHtml=(box,v)=>{
 if(!v)return '<p class="muted" style="margin:0">Enter the Vehicle Number first – the saved details and documents of that vehicle come automatically.</p>';
 const m=vMeta(v),rows=DT.map(([k,l,rq])=>{const d=m&&m.docs&&m.docs[k];
  const b=(a,t,cl)=>'<button type="button" class="'+(cl||'secondary')+'" onclick="pdAct(\''+a+'\',\''+box+'\',\''+k+'\')">'+t+'</button>';
  return '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee"><div style="flex:1 1 140px"><b>'+l+'</b> '+(rq?'<small style="color:#b42318">(required)</small>':'<small class="muted">(optional)</small>')+'</div>'+
   '<div style="flex:2 1 170px">'+(d?'<span style="color:#067647">✔ '+esc(d.name)+'</span> <small class="muted">'+fsz(d.size)+' · '+esc(d.at)+'</small>':'<span class="muted">— Not uploaded</span>')+'</div>'+
   '<div class="actions" style="margin:0"><input type="file" id="pdf_'+box+'_'+k+'" accept="image/*,application/pdf" style="display:none" onchange="pdUp(\''+box+'\',\''+k+'\',this)">'+
   b('up','⬆ '+(d?'Replace / Edit':'Upload'))+(d?b('view','👁 View')+b('dl','⬇ Download')+b('print','🖨 Print')+b('pdf','📄 PDF')+(canDel()?b('rm','🗑','danger'):''):'')+'</div></div>'}).join('');
 const miss=!hasDoc(v,'rc');
 return '<p style="margin:0 0 4px"><b>'+esc(String(v).trim().toUpperCase())+'</b></p>'+rows+'<p style="margin:10px 0 0;font-weight:700;color:'+(miss?'#b42318':'#067647')+'">'+(miss?'⚠ Vehicle RC is not uploaded yet – it is required before the weighment can be saved.':'✔ Required document (RC) uploaded.')+'</p>'};
window.pdRefresh=box=>{const el=document.getElementById(box);if(!el)return;el.innerHTML=panelHtml(box,(BOX[box]()||'').trim())};
window.pdUp=async(box,k,inp)=>{const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
 const v=(BOX[box]()||'').trim();if(!v){alert('Enter the Vehicle Number first.');return}
 if(await putDoc(v,k,f))pdRefresh(box)};
window.pdAct=async(a,box,k)=>{
 const v=(BOX[box]()||'').trim();if(!v)return;
 if(a==='up'){const e=document.getElementById('pdf_'+box+'_'+k);if(e)e.click();return}
 if(a==='view'){window.docView(encodeURIComponent(v),k);return}
 if(a==='rm'){window.docRemove(encodeURIComponent(v),k);return}
 let r;try{r=await dGet(vn(v)+'|'+k)}catch(e){r=null}

 try{
  if(a==='dl'){dlBlob(r.blob,base+'_'+safe(r.name));return}
  if(a==='pdf'){if(isImg)dlBlob(await imgPdf(r.blob),base+'.pdf');else dlBlob(r.blob,base+'.pdf');return}
  if(a==='print'){
   if(isImg){const u=await dataUrl(r.blob);printDoc(DL[k]+' – '+v.toUpperCase(),'<h3 style="margin:0 0 8px">'+esc(DL[k])+' – '+esc(v.toUpperCase())+'</h3><img src="'+u+'" style="max-width:100%;max-height:250mm">',false,'body{font:13px Arial,sans-serif;color:#111;margin:0;text-align:center}');}
   else{const u=URL.createObjectURL(r.blob);const w=window.open(u,'_blank');if(!w)alert('Please allow pop-ups, then press Print again.');else setTimeout(()=>URL.revokeObjectURL(u),60000)}
  }
 }catch(e){alert('Could not prepare this document. Try Download instead.')}};

 return '<div class="card"><h2>New Weight Machine Entry</h2>'+

const fy=d=>{const y=+d.slice(0,4),m=+d.slice(5,7),a=m<4?y-1:y;return String(a).slice(2)+'-'+String(a+1).slice(2)};
const invNo=ty=>{const p=bsV(ty,'prefix')+'/'+fy(today())+'/';let mx=0;(db.sales||[]).forEach(b=>{if(String(b.invoiceNo||'').startsWith(p))mx=Math.max(mx,+String(b.invoiceNo).slice(p.length)||0)});return p+String(mx+1).padStart(4,'0')};
const setTxt=(i,v)=>{const e=document.getElementById(i);if(e)e.textContent=v};
window.slOpen=v=>{ST.trip=String(v||'').trim().toUpperCase();ST.sel=null;render(true);scrollTo(0,0)};
window.slSave=()=>save();
window.slSet=(k,f,v)=>{const t=cur();if(!t)return;const l=LN(t)[k],r=rt(t,k,l.party,l);r[f]=v;if(f==='g')r.gSet=true;const m=calc(l,r);setTxt('slro_'+k,roTxt(m.ro));setTxt('slto_'+k,inr2(m.fin));slTot()};
window.slTot=()=>{const t=cur();if(!t)return;
 custs(t).forEach((c,ci)=>{const s=totals(t,c);setTxt('slTB'+ci,n0(s.b));setTxt('slTT'+ci,n0(s.tn));setTxt('slTR'+ci,roTxt(s.ro));setTxt('slTA'+ci,inr2(s.am));
  const rs=rowsOf(t).filter(x=>x.c===c&&!x.b),a=document.getElementById('slAll'+ci);if(a)a.checked=rs.length>0&&rs.every(x=>ST.sel.has(x.k))});
 const g=totals(t);setTxt('slGB',n0(g.b));setTxt('slGT',n0(g.tn));setTxt('slGA',inr2(g.am))};
window.slTog=(k,on)=>{on?ST.sel.add(k):ST.sel.delete(k);slTot()};
window.slAllC=(ci,on)=>{const t=cur();if(!t)return;const c=custs(t)[ci];rowsOf(t).filter(x=>x.c===c&&!x.b).forEach(x=>{on?ST.sel.add(x.k):ST.sel.delete(x.k);const e=document.getElementById('slck'+x.k);if(e)e.checked=on});slTot()};

const salesView=()=>{
 tripEnsure();
 const P=trans().filter(t=>t.weigh&&t.prod&&rowsOf(t).some(x=>!x.b));
 const head='<div class="pagehead"><h1><span style="border-left:4px solid #522295;padding-left:10px">Sales</span></h1></div>';
 const box='<div class="card" style="margin-bottom:14px"><div class="actions" style="margin:0;align-items:center"><b>Trip Plan No. *</b><input id="sltrip" list="dl_sltrip" value="'+esc(ST.trip)+'" placeholder="TP-00001" autocomplete="off" style="max-width:240px;text-transform:uppercase" onchange="slOpen(this.value)"><datalist id="dl_sltrip">'+P.map(t=>'<option value="'+esc(t.tripNo)+'" label="'+esc(t.vehicle)+'"></option>').join('')+'</datalist><button onclick="slOpen(document.getElementById(\'sltrip\').value)">Open</button></div></div>';
 if(!ST.trip)return head+box+'<p class="muted">Enter the Trip Plan No. to open the Sales screen.</p>';
 const t=cur();
 if(!t)return head+box+'<div class="card" style="border-left:5px solid #b42318">Trip Plan No. <b>'+esc(ST.trip)+'</b> not found.</div>';
 if(!t.weigh)return head+box+'<div class="card" style="border-left:5px solid #f59e0b">Trip Plan <b>'+esc(t.tripNo)+'</b> is not approved in Weigh Bridge yet – it opens here after <b>✔ Approve → Sales</b>.</div>';
  if(!t.prod)return head+box+'<div class="card" style="border-left:5px solid #f59e0b">Trip Plan <b>'+esc(t.tripNo)+'</b> is waiting for <b>Production Entry</b> \u2013 Sales bills can be made only after the Production Entry is saved.<br><br><button onclick="prOpenTrip(\''+esc(t.tripNo)+'\');section=\'Production Entry\';render(true)">Go to Production Entry \u2192</button></div>';
 const R=rowsOf(t);
 if(!ST.sel)ST.sel=new Set(R.filter(x=>!x.b).map(x=>x.k));
 const rh=h=>'<th style="text-align:right">'+h+'</th>';
 const lb=a=>'<span style="display:block;font-size:11px;color:#746c80;font-weight:600">'+a+'</span>';
 const bills=tripBills(t);
 const info='<p class="muted" style="margin:0 0 10px">Trip Plan <b>'+esc(t.tripNo)+'</b> · Vehicle <b>'+esc(t.vehicle)+'</b>'+(t.weigh.wbf?' · Weighment <b>'+esc(t.weigh.wbf)+'</b> · Net <b>'+n0(t.weigh.net)+' KG</b>':'')+' · Customers <b>'+custs(t).length+'</b></p>';
 const left=R.some(x=>!x.b);
 const top='<div class="actions" style="margin:0 0 12px">'+(left?'<button onclick="slBillAll()">🧾 Create All Bills (separate for each customer)</button>':'')+(bills.length?'<button class="secondary" onclick="slPrintAll()">🖨 Print All</button><button class="secondary" onclick="slPdfAll()">📄 PDF All</button><button class="secondary" onclick="slXlsAll()">📊 Excel All</button>':'')+'</div>';
 const blocks=custs(t).map((c,ci)=>{
  const X=R.filter(x=>x.c===c),rs=X.filter(x=>!x.b),allOn=rs.length>0&&rs.every(x=>ST.sel.has(x.k)),s=totals(t,c);
  const rows=X.map(x=>{const r=rt(t,x.k,x.c,x.l),m=calc(x.l,r),d=x.b?' disabled':'',tx=isTax(x.l);
   return '<tr><td><b style="color:#522295">'+esc(x.o.csn||'')+'</b></td><td><b>'+esc(x.l.o)+'</b></td><td>'+esc(x.o.date||'')+'</td><td>'+esc(x.c)+'</td><td>'+esc(x.l.item)+'</td><td style="text-align:right">'+n0(x.l.bagKg)+'</td><td style="text-align:right">'+n0(x.l.bags)+'</td><td style="text-align:right">'+n0(x.l.tons)+'</td><td>'+esc(x.l.remarks||'')+'</td>'+
    '<td><input type="number" step=".01" value="'+esc(r.r)+'"'+d+' oninput="slSet('+x.k+',\'r\',this.value)" onchange="slSave()" style="width:96px" placeholder="0.00"></td>'+
    '<td>'+(tx?'<input type="number" step=".01" value="'+esc(r.g)+'"'+d+' oninput="slSet('+x.k+',\'g\',this.value)" onchange="slSave()" style="width:72px" placeholder="%">':'<span class="muted">Nil</span>')+'</td>'+
    '<td style="text-align:right"><b id="slro_'+x.k+'">'+roTxt(m.ro)+'</b></td><td style="text-align:right"><b id="slto_'+x.k+'" style="color:#341857">'+inr2(m.fin)+'</b></td>'+
    '<td style="text-align:center">'+(x.b?'<span class="apv g">✔ '+esc(x.b.invoiceNo||x.b.serial)+'</span>':'<input type="checkbox" id="slck'+x.k+'" style="width:auto" '+(ST.sel.has(x.k)?'checked ':'')+'onclick="slTog('+x.k+',this.checked)">')+'</td></tr>'}).join('');
  const foot='<tr style="background:#f2f0fa"><th colspan="5" style="text-align:right">TOTAL</th><th></th><th style="text-align:right">'+lb('Total Bags')+'<b id="slTB'+ci+'">'+n0(s.b)+'</b></th><th style="text-align:right">'+lb('Total Tonnage')+'<b id="slTT'+ci+'">'+n0(s.tn)+'</b></th><th></th><th></th><th></th><th style="text-align:right">'+lb('Round Off')+'<b id="slTR'+ci+'">'+roTxt(s.ro)+'</b></th><th style="text-align:right">'+lb('Total Amount')+'<b id="slTA'+ci+'">'+inr2(s.am)+'</b></th><th></th></tr>';
  const types=[...new Set(rs.map(x=>isTax(x.l)?'T':'S'))].map(typeName).join(' + ');
  const mine=bills.filter(b=>b.party===c);
  const acts='<div class="actions" style="margin:10px 0 0;align-items:center">'+(rs.length?'<button onclick="slBill('+ci+')">🧾 Create Bill – '+esc(c)+'</button><small class="muted">'+esc(types)+'</small>':'')+
   mine.map(b=>'<span class="apv g">✔ '+esc(b.invoiceNo)+' · '+esc(b.billType)+'</span><button class="secondary" onclick="slPrint('+b.id+')">🖨 Print</button><button class="secondary" onclick="slPdf('+b.id+')">📄 PDF</button><button class="secondary" onclick="slXls('+b.id+')">📊 Excel</button>').join('')+'</div>';
  return '<div class="card" style="margin-bottom:14px"><h2 style="margin:0 0 8px">Customer: '+esc(c)+'</h2><div class="tablewrap"><table><tr><th>Serial No.</th><th>Order No.</th><th>Order Date</th><th>Customer</th><th>Item</th>'+rh('KG')+rh('No. of Bags')+rh('Tons')+'<th>Remarks</th><th>Rate (₹/bag)</th><th>GST %</th>'+rh('Round Off')+rh('Total Amount')+'<th style="text-align:center">Select '+(rs.length?'<input type="checkbox" id="slAll'+ci+'" style="width:auto" '+(allOn?'checked ':'')+'onclick="slAllC('+ci+',this.checked)">':'')+'</th></tr>'+rows+foot+'</table></div>'+acts+'</div>'}).join('');
 const g=totals(t);

 return head+box+'<div class="card" style="margin-bottom:14px">'+info+top+'</div>'+blocks+grand};
V['Sales']=()=>{editingBill=null;return salesView()};

/* ---------- Create Bill: every customer separately, every bill its own Invoice No. (Tax Invoice and Bill of Supply are separate bills) ---------- */
const make=(t,cs)=>{
 const R=rowsOf(t).filter(x=>cs.includes(x.c)&&!x.b&&ST.sel&&ST.sel.has(x.k));
 if(!R.length){alert('Tick at least one line.');return}
 const bad=R.filter(x=>!(+rt(t,x.k,x.c,x.l).r>0));
 if(bad.length){alert('Enter the Rate for every ticked line ('+bad.length+' line(s) have no rate).');return}
 const G=[];cs.forEach(c=>['T','S'].forEach(ty=>{const X=R.filter(x=>x.c===c&&(isTax(x.l)?'T':'S')===ty);if(X.length)G.push({c,ty,X})}));
 if(!confirm('Create '+G.length+' separate bill(s) for Trip Plan '+t.tripNo+' ?\n\n'+G.map(g=>'• '+g.c+' – '+typeName(g.ty)+' ('+g.X.length+' line'+(g.X.length>1?'s':'')+')').join('\n')))return;
 db.sales=db.sales||[];
 let mx=Math.max(0,...db.sales.map(b=>+String(b.serial||'').replace(/\D/g,'')||0));const made=[];
 G.forEach((g,i)=>{let kg=0,sub=0,gst=0,amt=0,ro=0,bags=0,tons=0;
  const pl=g.X.map(x=>{const r=rt(t,x.k,x.c,x.l),m=calc(x.l,r);kg+=(+x.l.bagKg||0)*(+x.l.bags||0);sub+=m.am;gst+=m.gs;amt+=m.fin;ro+=m.ro;bags+=+x.l.bags||0;tons+=+x.l.tons||0;
   return{csn:x.o.csn||'',o:x.l.o,date:x.o.date||'',item:x.l.item,bagKg:x.l.bagKg,bags:x.l.bags,tons:x.l.tons,remarks:x.l.remarks||'',rate:r.r,gst:isTax(x.l)?(r.g===''?0:r.g):'',ro:m.ro,fin:m.fin}});
  const lines=g.X.map(x=>{const r=rt(t,x.k,x.c,x.l);return{item:x.l.item,kgs:String(x.l.bagKg),qty:String(x.l.bags),rate:String(r.r),tax:String(isTax(x.l)?(r.g===''?0:r.g):0)}});
  const serial='SB-'+String(++mx).padStart(5,'0'),inv=invNo(g.ty);
  db.sales.unshift({id:Date.now()+i,serial,invoiceNo:inv,billType:typeName(g.ty),date:today(),status:'Posted',stype:'',category:'',billno:inv,gate:inv,tripNo:t.tripNo,tripId:t.id,lineKeys:g.X.map(x=>x.k),pl,orders:[...new Set(g.X.map(x=>x.l.o))].join(', '),party:g.c,city:'',vehicle:t.vehicle,lines,item:lines[0].item+(lines.length>1?' (+'+(lines.length-1)+')':''),weight:kg,net:kg,freight:0,discount:0,roundoff:+ro.toFixed(2),tds:0,slip:(t.weigh&&t.weigh.wbf)||'',notes:'',subTotal:+sub.toFixed(2),gstTotal:+gst.toFixed(2),totBags:bags,totTons:+tons.toFixed(3),amount:+amt.toFixed(2)});
  audit('Create sales',serial+' '+inv+' '+t.tripNo+' '+g.c);made.push(inv)});
 save();alert('✔ '+made.length+' bill(s) created:\n\n'+made.join('\n'));
 R.forEach(x=>ST.sel.delete(x.k));render(true)};
window.slBill=ci=>{const t=cur();if(!t||!t.weigh)return;make(t,[custs(t)[ci]])};
window.slBillAll=()=>{const t=cur();if(!t||!t.weigh)return;make(t,custs(t))};

const hasLocal=()=>typeof db!=='undefined'&&db.users&&db.users.length>0;
const idbKeys=async()=>{try{const d=await idbD();return await new Promise(r=>{const q=d.transaction('d').objectStore('d').getAllKeys();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([])})}catch(e){return[]}};
const idbGet=async k=>{const d=await idbD();return await new Promise(r=>{const q=d.transaction('d').objectStore('d').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})};
const CONFLICT='The cloud has newer data from another device, or this device has changes not yet saved.\n\nOK = use the CLOUD data (changes on this device that are not saved are lost)\nCancel = keep THIS device\'s data and overwrite the cloud';

/* ---- push (device -> cloud) ---- */
let pushing=false,again=false,dirtyN=0,timer=null;const last={};
function markDirty(){LS.setItem('fb_dirty','1');dirtyN++;stat('\u2601 Saving...');clearTimeout(timer);timer=setTimeout(()=>push(),1200)}
async function push(force,boot){
 if(pushing){again=true;return}
 if(!boot)await ready;pushing=true;const n0=dirtyN;
 try{
  stat('\u2601 Saving...');
  const ms=await F.getDoc(D('meta'));const m=ms.exists()?ms.data():{ts:0};m.keys=m.keys||{};m.files=m.files||{};
  if(!force&&ms.exists()&&m.ts!==(+LS.fb_ts||0)){
   if(confirm(CONFLICT)){await pull(m);SS.setItem('fb_ready','1');location.reload();return}
  }
  for(const k of Object.keys(db)){
   const s=JSON.stringify(db[k]);if(last[k]===s&&m.keys[k])continue;
   const cs=chunk(s),b=F.writeBatch(fs);cs.forEach((c,i)=>b.set(D('d_'+k+'_'+i),{s:c}));await b.commit();
   last[k]=s;m.keys[k]={n:cs.length}}
  const sd=new Set(JSON.parse(LS.fb_docs||'[]'));
  for(const k of await idbKeys()){
   if(sd.has(k))continue;const id='f_'+hash(String(k));
   if(m.files[id]){sd.add(k);continue}
   const rec=await idbGet(k);if(!rec||!rec.blob)continue;
   const cs=chunk(JSON.stringify({k:rec.k,name:rec.name,mime:rec.mime,b64:await b64(rec.blob)})),b=F.writeBatch(fs);
   cs.forEach((c,i)=>b.set(D(id+'_'+i),{s:c}));await b.commit();m.files[id]={k,n:cs.length};sd.add(k)}
  LS.setItem('fb_docs',JSON.stringify([...sd]));
  m.ts=Date.now();await F.setDoc(D('meta'),m);
  LS.setItem('fb_ts',String(m.ts));if(dirtyN===n0)LS.setItem('fb_dirty','0');
  stat('\u2601 Synced');
 }catch(e){console.warn('push',e);stat('\u26A0 Not saved - tap to retry',1)}
 finally{pushing=false;if(again){again=false;setTimeout(()=>push(),300)}}
}

/* ---- pull (cloud -> device) ---- */
async function pull(m){
 gtxt('Loading your data...');stat('\u2601 Loading...');
 const nd={};
 await Promise.all(Object.keys(m.keys||{}).map(async k=>{
  const r=await Promise.all(Array.from({length:m.keys[k].n},(_,i)=>F.getDoc(D('d_'+k+'_'+i))));
  nd[k]=JSON.parse(r.map(x=>x.data().s).join(''))}));
 const have=new Set(await idbKeys()),sd=new Set(JSON.parse(LS.fb_docs||'[]'));
 for(const id of Object.keys(m.files||{})){
  const f=m.files[id];sd.add(f.k);if(have.has(f.k))continue;
  const r=await Promise.all(Array.from({length:f.n},(_,i)=>F.getDoc(D(id+'_'+i))));
  await docsIn([JSON.parse(r.map(x=>x.data().s).join(''))])}
 LS.setItem(KEY,JSON.stringify(nd));LS.setItem('fb_ts',String(m.ts));LS.setItem('fb_dirty','0');LS.setItem('fb_docs',JSON.stringify([...sd]));
}

/* ---- first load of a browser session ---- */
async function startupSync(){
 const ms=await F.getDoc(D('meta')),dirty=LS.fb_dirty==='1',synced=+LS.fb_ts||0;
 if(!ms.exists()){if(hasLocal())await push(true,true);return}
 const m=ms.data();
 if(m.ts===synced){if(dirty)await push(false,true);return}
 if((dirty||synced===0)&&hasLocal()){if(!confirm(CONFLICT)){await push(true,true);return}}
 await pull(m);SS.setItem('fb_ready','1');location.reload();await new Promise(()=>{});
}

async function proceed(){
 if(started)return;started=true;
 try{
  gtxt('Syncing...');
  if(!SS.getItem('fb_ready'))await startupSync();
  SS.setItem('fb_ready','1');
  gate.style.display='none';readyRes();stat('\u2601 Synced');
  if(LS.fb_dirty==='1')push();
 }catch(e){console.warn(e);started=false;gtxt('Could not sync with the cloud.');er((e&&e.code)||(e&&e.message)||'');
  $('fbForm').style.display='none';$('fbEr').insertAdjacentHTML('afterend','<button id="fbRt" style="margin-top:10px">Retry</button>');$('fbRt').onclick=()=>location.reload()}
}

/* ---- hooks into the existing app ---- */
const _sv=window.save;window.save=function(){const r=_sv.apply(this,arguments);markDirty();return r};
const _ar=window.applyRestore;if(_ar)window.applyRestore=function(){LS.setItem('fb_dirty','1');return _ar.apply(this,arguments)};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&LS.fb_dirty==='1'&&started)push()});
window.fbFlush=function(){return push()};
st.onclick=()=>{
 if(st.dataset.bad){push();return}
 if(confirm('Sign out of the cloud on this device? You will need the cloud email and password again.')){AU.signOut(auth).then(()=>{SS.clear();location.reload()})}};

/* ---- boot ---- */
(async function(){
 try{
  const [A,a,f]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  AU=a;F=f;const app=A.initializeApp(CFG);
  auth=AU.initializeAuth(app,{persistence:[AU.indexedDBLocalPersistence,AU.browserLocalPersistence]});
  fs=F.initializeFirestore(app,{experimentalAutoDetectLongPolling:true});
 }catch(e){console.warn(e);gtxt('Cannot connect to Firebase. Check the internet and try again.');
  $('fbEr').insertAdjacentHTML('afterend','<button id="fbRt" style="margin-top:10px">Retry</button>');$('fbRt').onclick=()=>location.reload();return}
 $('fbGo').onclick=async()=>{const e=$('fbE').value.trim(),p=$('fbP').value;if(!e||!p){er('Enter email and password.');return}
  er('');$('fbGo').disabled=true;try{await AU.signInWithEmailAndPassword(auth,e,p)}catch(x){er(errTxt(x))}$('fbGo').disabled=false};
 $('fbP').addEventListener('keydown',e=>{if(e.key==='Enter')$('fbGo').click()});
 AU.onAuthStateChanged(auth,u=>{if(u){$('fbForm').style.display='none';proceed()}else{started=false;gate.style.display='flex';gtxt('Login with your cloud email and password.');$('fbForm').style.display='block'}});
})();
})();
</script>
<script>
/* ===== V9: logout without backup popup · Forgot/Restore links only for the Admin ID ===== */
(function(){
 /* 1. Logout: no backup / passphrase popup. Data is already saved on this device and in the cloud. */
 window.logout=async function(){
  try{audit('Logout','Signed out')}catch(e){}
  current=null;
  try{if(window.fbFlush)await Promise.race([window.fbFlush(),new Promise(r=>setTimeout(r,2500))])}catch(e){}
  location.reload()};
 /* 2. "Forgot / Reset" and "Restore" links: shown only when the typed User ID is an Admin
       (Restore is also shown on a brand-new browser that has no users yet). */
 const f=document.getElementById('forgotLink'),r=document.getElementById('lgRestore'),inp=document.getElementById('user');
 function upd(){
  const v=(inp&&inp.value||'').trim(),adm=db.users.some(u=>u.role==='Admin'&&u.id===v),none=!db.users.length;
  if(f)f.style.display=adm?'block':'none';
  if(r)r.style.display=(adm||none)?'block':'none'}
 if(inp){['input','change','keyup','blur'].forEach(e=>inp.addEventListener(e,upd));setInterval(upd,400)}
 upd();
 /* password reset on the login screen works for Admin IDs only */
 const _o=window.openRec;
 if(_o)window.openRec=function(){
  _o.apply(this,arguments);
  const sel=document.getElementById('rcUser'),typed=(inp.value||'').trim();
  if(sel)sel.innerHTML=db.users.filter(u=>u.role==='Admin').map(u=>'<option value="'+esc(u.id)+'"'+(u.id===typed?' selected':'')+'>'+esc(u.id)+' · Admin'+(u.active===false?' (disabled)':'')+'</option>').join('')};
 const _d=window.doRecover;
 if(_d)window.doRecover=function(){
  const u=db.users.find(x=>x.id===document.getElementById('rcUser').value);
  if(!u||u.role!=='Admin'){msg('Only the Admin password can be reset here. Other users: ask the Admin to reset it in the Admin Panel.');return}
  return _d.apply(this,arguments)};
})();
</script>
