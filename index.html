<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; font-src data:; script-src 'unsafe-inline' https://www.gstatic.com; style-src 'unsafe-inline'; img-src data: blob:; connect-src https://*.googleapis.com https://*.firebaseio.com https://www.gstatic.com; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP</title>
<style>
:root{--green:#341857;--green2:#522295;--mint:#ebe5f7;--bg:#f2f1f6;--card:#fff;--ink:#251932;--muted:#746c80;--line:#dfdde7;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial, sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--green2);color:white;font-weight:700}
button.secondary{background:var(--mint);color:var(--green)}button.danger{background:#fde8e7;color:var(--red)}
header{background:var(--green);color:white;padding:13px 18px;display:flex;gap:15px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:4}
.brand{font-weight:800;font-size:18px;white-space:nowrap}.userbar{display:flex;gap:10px;align-items:center;font-size:12px}
nav{display:flex;gap:4px;overflow:auto;background:#fff;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:49px;z-index:3}
nav button{background:transparent;color:#504362;white-space:nowrap;padding:10px 12px}nav button.active{background:var(--green2);color:white}
main{max-width:1400px;margin:22px auto;padding:0 18px}.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 14px}h3{font-size:14px;color:var(--green);margin:18px 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 2px 8px #20193910}
.metric{border-top:4px solid var(--green2)}.metric small{color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}.metric strong{display:block;font-size:25px;margin:10px 0 4px;color:var(--green)}.metric span{color:#9986b5;font-size:12px}
.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.quick button{background:#fff;color:var(--green);border:1px solid var(--line);text-align:left;min-height:68px}
.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.field label{display:block;color:#6a617c;font-size:11px;font-weight:800;letter-spacing:.5px;margin:0 0 6px;text-transform:uppercase}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px;background:#fdfcfe;color:var(--ink);min-width:0}
textarea{min-height:75px}.readonly{background:#f0eff5;color:#6d667a}.section{border-bottom:1px solid var(--line);padding-bottom:7px;margin:22px 0 12px;color:var(--green);font-weight:800}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.tablewrap{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line)}th{background:#f4f2fa;color:#594972;font-size:11px;text-transform:uppercase;letter-spacing:.4px}tr:hover td{background:#fcfbfe}.pill{background:var(--mint);color:var(--green);padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700}
.login{max-width:430px;margin:9vh auto;padding:26px}.login h1{margin-bottom:8px}.muted{color:var(--muted)}.hidden{display:none!important}.right{text-align:right}.error{color:var(--red);margin-top:10px}.total{font-size:20px;color:var(--green);font-weight:800}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.tiles{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){header{padding:11px}.brand{font-size:15px}main{padding:0 10px}.grid,.tiles,.formgrid{grid-template-columns:1fr 1fr}.userbar span{display:none}.login{margin:5vh 12px}.pagehead{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head>
<body>
<div id="login" class="card login">
  <div class="brand" style="color:var(--green)">ERP</div><p class="muted">Software</p>
  <div id="setup" class="hidden"><h2>Create First Admin</h2><p class="muted">On first launch, create your Admin account.</p>
    <div class="field"><label>Admin User ID</label><input id="newUser" placeholder="admin"></div><br>
    <div class="field"><label>Password / PIN</label><input id="newPass" type="password" placeholder="Create password"></div><br>
    <button onclick="createAdmin()">Create Admin & Continue</button>
  </div>
  <div id="signin" class="hidden"><h2>Login</h2><div class="field"><label>User ID</label><input id="user" autocomplete="username"></div><br>
    <div class="field"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div><br>
    <button style="width:100%" onclick="login()">Login</button>
  </div><div id="loginMsg" class="error"></div>
  <p class="muted" style="font-size:11px;margin-top:20px">Secure build. Data is stored in this browser on this device - take regular backups.</p>
</div>
<div id="app" class="hidden">
<header><div class="brand">ERP</div><div class="userbar"><span id="who"></span><button class="danger" onclick="logout()">Logout</button></div></header>
<nav id="nav"></nav><main id="view"></main>
</div>
<script>
const KEY='tsr_erp_v1';
let db=load(),current=null,section='Dashboard',editingBill=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{users:[],purchases:[],sales:[],parties:[],items:[],branches:[],vehicles:[],brokers:[],payments:[],slips:[],audit:[]}}catch(e){return {users:[],purchases:[],sales:[],parties:[],items:[],branches:[],vehicles:[],brokers:[],payments:[],slips:[],audit:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function audit(action,detail){db.audit.unshift({date:new Date().toLocaleString(),user:current?.id||'System',action,detail});save()}
function init(){if(!db.users.length){document.getElementById('setup').classList.remove('hidden')}else{document.getElementById('signin').classList.remove('hidden')}}
function createAdmin(){let id=document.getElementById('newUser').value.trim(),pw=document.getElementById('newPass').value;if(!id||pw.length<6){msg('Enter a User ID and a password of at least 6 characters.');return}db.users.push({id,pw,role:'Admin',active:true});save();msg('Admin created. Please log in now.');document.getElementById('setup').classList.add('hidden');document.getElementById('signin').classList.remove('hidden')}
function msg(t){document.getElementById('loginMsg').textContent=t}
function login(){let id=document.getElementById('user').value.trim(),pw=document.getElementById('pass').value,u=db.users.find(x=>x.id===id&&x.pw===pw&&x.active!==false);if(!u){msg('Incorrect User ID or password.');return}current=u;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=u.id+' · '+u.role;audit('Login','Signed in');render()}
function logout(){audit('Logout','Signed out');current=null;location.reload()}
const pages=['Dashboard','Purchase','Sales','Payment Advice','Stock','Branches','Items & Masters','Reports','Internal Audit','Weigh Bridge','Admin Panel'];
function render(){document.getElementById('nav').innerHTML=pages.filter(p=>p!=='Admin Panel'||current.role==='Admin').map(p=>`<button class="${p===section?'active':''}" onclick="openPage('${p}')">${p}</button>`).join('');let v=document.getElementById('view');v.innerHTML=section==='Dashboard'?dashboard():section==='Purchase'?transactions('purchase'):section==='Sales'?transactions('sales'):section==='Payment Advice'?payments():section==='Stock'?stockPage():section==='Branches'?master('branches','Branch'):section==='Items & Masters'?masters():section==='Reports'?reports():section==='Internal Audit'?auditPage():section==='Weigh Bridge'?weighbridge():admin(); }
function openPage(p){if(p==='Purchase'||p==='Sales'){editingBill=null}section=p;render()}
function dashboard(){let p=sum(db.purchases),s=sum(db.sales),m=s-p;return `<div class="pagehead"><h1>Dashboard</h1><span class="pill">Live browser preview</span></div><div class="grid"><div class="card metric"><small>Purchase Total</small><strong>${money(p)}</strong><span>${db.purchases.length} bills</span></div><div class="card metric"><small>Sales Total</small><strong>${money(s)}</strong><span>${db.sales.length} bills</span></div><div class="card metric"><small>Gross Margin</small><strong>${money(m)}</strong><span>Sales − Purchase (basic)</span></div></div><h2 style="margin-top:25px">Quick Access</h2><div class="quick">${[['+ New Purchase Bill','Purchase'],['+ New Sales Bill','Sales'],['Payment Advice','Payment Advice'],['Stock Entry / View','Stock'],['Manage Branches','Branches'],['Items & Masters','Items & Masters'],['View Reports','Reports']].map(x=>`<button onclick="openPage('${x[1]}')">${x[0]}</button>`).join('')}</div><div class="card" style="margin-top:18px"><h2>Recent Transactions</h2>${recent()}</div>`}
function sum(a){return a.reduce((n,x)=>n+Number(x.amount||0),0)}
function transactions(type){let arr=type==='purchase'?db.purchases:db.sales,title=type==='purchase'?'Purchase':'Sales';return `<div class="pagehead"><h1>${title}</h1><button onclick="billForm('${type}')">+ New ${title} Bill</button></div><div class="card"><h2>New ${title} Bill</h2><div class="formgrid">
${field('Serial No.',`<input id="serial" class="readonly" readonly value="${title==='Purchase'?'PB':'SB'}-${String(arr.length+1).padStart(5,'0')}">`)}
${field('Bill Date *',`<input id="date" type="date" value="${new Date().toISOString().slice(0,10)}">`)}
${field('Bill Number *',`<input id="billno" placeholder="e.g. INV-001">`)}
${field('Gate Pass Number',`<input id="gate" placeholder="GP-XXXX">`)}
${field('Status',`<select id="status"><option>Draft</option><option>Posted</option><option>Cancelled</option></select>`)}
${field('Category *',`<select id="category"><option value="">— Select Category —</option><option>Paddy</option><option>Rice</option><option>By Product</option><option>Other</option></select>`)}
${field(type==='purchase'?'Supplier / Party *':'Customer / Party *',`<select id="party"><option value="">Select from master...</option>${db.parties.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select>`)}
${field('Party City',`<input id="city" placeholder="City / Place">`)}
${field('Item *',`<select id="item"><option value="">Select from master...</option>${db.items.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select>`)}
${field('Unloading / Delivery Location',`<input id="location" placeholder="Location">`)}
${field('Bill Weight (KG) *',`<input id="weight" type="number" step=".01" value="0" oninput="calcBill()">`)}
${field('Unit Price (₹/KG) *',`<input id="rate" type="number" step=".01" value="0" oninput="calcBill()">`)}
${field('Net Weight (KG)',`<input id="net" class="readonly" readonly value="0">`)}
${field('Weight Shortage (KG)',`<input id="shortage" type="number" value="0">`)}
${field('Tax %',`<input id="tax" type="number" value="0" oninput="calcBill()">`)}
${field('Tax Amount (₹)',`<input id="taxamt" class="readonly" readonly value="0">`)}
${field('Moisture (%)',`<input id="moisture" type="number" value="0">`)}
${field('Bill Amount (₹)',`<input id="amount" class="readonly" readonly value="0">`)}
${field('Lorry Freight (₹)',`<input id="freight" type="number" value="0" oninput="calcBill()">`)}
${field('Other Expenses (₹)',`<input id="expenses" type="number" value="0" oninput="calcBill()">`)}
${field('Round Off (₹)',`<input id="roundoff" type="number" value="0" oninput="calcBill()">`)}
${field('TDS Amount (₹)',`<input id="tds" type="number" value="0" oninput="calcBill()">`)}
${field('Broker',`<select id="broker"><option value="">Select broker</option>${db.brokers.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select>`)}
${field('Broker Commission (₹)',`<input id="commission" type="number" value="0" oninput="calcBill()">`)}
${field('Vehicle Number',`<select id="vehicle"><option value="">Select vehicle</option>${db.vehicles.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select>`)}
${field('Weigh Bridge Slip',`<select id="slip"><option value="">— Select Slip —</option>${db.slips.map(x=>`<option value="${x.id}">${esc(x.id)} · ${esc(x.vehicle)} · ${x.weight} KG</option>`).join('')}</select>`)}
</div><div class="field" style="margin-top:12px"><label>Notes</label><textarea id="notes" placeholder="Optional remarks"></textarea></div><div class="actions"><button onclick="saveBill('${type}')">Save ${title} Bill</button><button class="secondary" onclick="render()">Clear</button></div></div><div class="card" style="margin-top:16px"><h2>Recent ${title} Bills</h2>${tableBills(arr,type)}</div>`}
function field(label,control){return `<div class="field"><label>${label}</label>${control}</div>`}
function val(id){return document.getElementById(id)?.value||''}
function calcBill(){let w=+val('weight'),r=+val('rate'),tax=+val('tax'),base=w*r,ta=base*tax/100;let amount=base+ta+(+val('freight'))+(+val('expenses'))+(+val('roundoff'))-(+val('tds'))+(+val('commission'));document.getElementById('net').value=w-(+val('shortage')||0);document.getElementById('taxamt').value=ta.toFixed(2);document.getElementById('amount').value=amount.toFixed(2)}
function saveBill(type){
 let required=['date','billno','category','party','item'];
 if(required.some(x=>!val(x))||+val('weight')<=0){alert('Please fill all required fields and enter valid weight.');return}
 let arr=type==='purchase'?db.purchases:db.sales;
 let record={id:editingBill?.id||Date.now(),serial:val('serial'),date:val('date'),billno:val('billno'),gate:val('gate'),status:val('status'),category:val('category'),party:val('party'),city:val('city'),item:val('item'),location:val('location'),weight:+val('weight'),rate:+val('rate'),net:+val('net'),shortage:+val('shortage'),tax:+val('tax'),taxamt:+val('taxamt'),moisture:+val('moisture'),amount:+val('amount'),freight:+val('freight'),expenses:+val('expenses'),roundoff:+val('roundoff'),tds:+val('tds'),broker:val('broker'),commission:+val('commission'),vehicle:val('vehicle'),slip:val('slip'),notes:val('notes')};
 if(editingBill&&editingBill.type===type){let i=arr.findIndex(x=>x.id===editingBill.id);if(i>=0)arr[i]=record;audit('Edit '+type,record.billno);editingBill=null}
 else{arr.unshift(record);audit('Create '+type,record.billno)}
 save();alert('Bill saved in this browser.');render()
}
function tableBills(arr,type){if(!arr.length)return '<p class="muted">No records yet.</p>';return `<div class="tablewrap"><table><tr><th>Serial</th><th>Date</th><th>Bill No.</th><th>Party</th><th>Item</th><th>Weight KG</th><th>Amount</th><th>Status</th><th>Actions</th></tr>${arr.map(x=>`<tr><td>${esc(x.serial)}</td><td>${esc(x.date)}</td><td>${esc(x.billno)}</td><td>${esc(x.party)}</td><td>${esc(x.item)}</td><td>${x.weight.toLocaleString('en-IN')}</td><td>${money(x.amount)}</td><td><span class="pill">${esc(x.status)}</span></td><td><button class="secondary" onclick="editBill('${type}',${x.id})">Edit</button> <button class="danger" onclick="deleteBill('${type}',${x.id})">Delete</button></td></tr>`).join('')}</table></div>`}
function masters(){return `<div class="pagehead"><h1>Items & Masters</h1></div><div class="grid">${masterCard('parties','Party / Supplier / Customer')}${masterCard('items','Items')}${masterCard('vehicles','Vehicles')}${masterCard('brokers','Brokers')}</div>`}
function masterCard(key,title){return `<div class="card"><h2>${title}</h2><input id="m_${key}" placeholder="Enter ${title} name"><div class="actions"><button onclick="addMaster('${key}')">Add</button></div><ul>${db[key].map(x=>`<li>${esc(x.name)}</li>`).join('')}</ul></div>`}
function addMaster(k){let v=document.getElementById('m_'+k).value.trim();if(!v)return;db[k].push({name:v});save();audit('Add master',k+': '+v);render()}
function master(key,title){return `<div class="pagehead"><h1>${title}</h1></div><div class="card"><input id="branchName" placeholder="Branch name"><div class="actions"><button onclick="addBranch()">Add Branch</button></div><div class="tablewrap"><table><tr><th>Branch</th></tr>${db[key].map(x=>`<tr><td>${esc(x.name)}</td></tr>`).join('')}</table></div></div>`}
function addBranch(){let v=val('branchName').trim();if(v){db.branches.push({name:v});save();audit('Add branch',v);render()}}
function payments(){return `<div class="pagehead"><h1>Payment Advice</h1></div><div class="card"><div class="formgrid">${field('Date','<input id="paydate" type="date" value="'+new Date().toISOString().slice(0,10)+'">')}${field('Party','<select id="payparty"><option value="">Select party</option>'+db.parties.map(x=>`<option>${esc(x.name)}</option>`).join('')+'</select>')}${field('Type','<select id="paytype"><option>Receipt</option><option>Payment</option></select>')}${field('Amount (₹)','<input id="payamt" type="number" min="1">')}${field('Reference','<input id="payref" placeholder="UTR / Cheque / Ref">')}</div><div class="actions"><button onclick="savePayment()">Save Payment Advice</button></div></div><div class="card" style="margin-top:14px"><h2>Payment Records</h2><div class="tablewrap"><table><tr><th>Date</th><th>Party</th><th>Type</th><th>Amount</th><th>Reference</th></tr>${db.payments.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.party)}</td><td>${esc(x.type)}</td><td>${money(x.amount)}</td><td>${esc(x.ref)}</td></tr>`).join('')}</table></div></div>`}
function savePayment(){if(!val('payparty')||+val('payamt')<=0){alert('Select party and enter amount');return}db.payments.unshift({date:val('paydate'),party:val('payparty'),type:val('paytype'),amount:+val('payamt'),ref:val('payref')});save();audit('Payment advice',val('paytype')+' '+val('payamt'));render()}
function stockPage(){
 let names=[...new Set([...db.purchases.map(x=>x.item),...db.sales.map(x=>x.item)])].filter(Boolean);
 let rows=names.map(name=>{let bought=db.purchases.filter(x=>x.item===name).reduce((a,x)=>a+(+x.net||+x.weight||0),0);let sold=db.sales.filter(x=>x.item===name).reduce((a,x)=>a+(+x.net||+x.weight||0),0);return {name,bought,sold,balance:bought-sold}});
 return `<div class="pagehead"><h1>Stock</h1><span class="pill">Purchase − Sales</span></div><div class="card"><p class="muted">Stock is calculated from the KG weights entered in Purchase and Sales bills.</p><div class="tablewrap"><table><tr><th>Item</th><th>Purchased KG</th><th>Sold KG</th><th>Available KG</th></tr>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.bought.toLocaleString('en-IN')}</td><td>${x.sold.toLocaleString('en-IN')}</td><td><b>${x.balance.toLocaleString('en-IN')}</b></td></tr>`).join('')}</table></div>${rows.length?'':'<p class="muted">Add Purchase and Sales entries to see stock.</p>'}</div>`
}
function reports(){return `<div class="pagehead"><h1>Reports</h1><button onclick="exportCSV()">Export CSV</button></div><div class="grid"><div class="card"><h2>Purchase Summary</h2><div class="total">${money(sum(db.purchases))}</div>${db.purchases.length} bills</div><div class="card"><h2>Sales Summary</h2><div class="total">${money(sum(db.sales))}</div>${db.sales.length} bills</div><div class="card"><h2>Payments</h2><div class="total">${money(sum(db.payments))}</div>${db.payments.length} entries</div></div><div class="card" style="margin-top:14px"><h2>Transaction Summary</h2>${recent()}</div>`}
function recent(){let a=[...db.purchases.map(x=>({...x,kind:'Purchase'})),...db.sales.map(x=>({...x,kind:'Sales'}))].slice(0,8);return a.length?`<div class="tablewrap"><table><tr><th>Type</th><th>Date</th><th>Bill No.</th><th>Party</th><th>Amount</th></tr>${a.map(x=>`<tr><td>${x.kind}</td><td>${esc(x.date)}</td><td>${esc(x.billno)}</td><td>${esc(x.party)}</td><td>${money(x.amount)}</td></tr>`).join('')}</table></div>`:'<p class="muted">No transactions entered.</p>'}
function exportCSV(){let rows=[['Type','Date','Serial','Bill No','Party','Item','Weight KG','Amount'],...['purchases','sales'].flatMap(k=>inDR(db[k]).map(x=>[k,x.date,x.serial,x.billno,x.party,x.item,x.weight,x.amount]))];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ERP_Report.csv';a.click();URL.revokeObjectURL(a.href)}
function auditPage(){return `<div class="pagehead"><h1>Internal Audit</h1></div><div class="card"><div class="tablewrap"><table><tr><th>Date & Time</th><th>User</th><th>Action</th><th>Details</th></tr>${db.audit.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.user)}</td><td>${esc(x.action)}</td><td>${esc(x.detail)}</td></tr>`).join('')}</table></div></div>`}
function weighbridge(){return `<div class="pagehead"><h1>Weigh Bridge</h1></div><div class="card"><div class="formgrid">${field('Slip Number','<input id="slipno" placeholder="WB-0001">')}${field('Vehicle Number','<input id="slipveh" placeholder="TN 00 AB 0000">')}${field('Gross Weight (KG)','<input id="gross" type="number">')}${field('Tare Weight (KG)','<input id="tare" type="number">')}</div><div class="actions"><button onclick="saveSlip()">Save Weigh Bridge Slip</button></div></div><div class="card" style="margin-top:14px"><h2>Saved Slips</h2><div class="tablewrap"><table><tr><th>Slip</th><th>Vehicle</th><th>Gross</th><th>Tare</th><th>Net</th></tr>${db.slips.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.vehicle)}</td><td>${x.gross}</td><td>${x.tare}</td><td>${x.weight}</td></tr>`).join('')}</table></div></div>`}
function saveSlip(){let gross=+val('gross'),tare=+val('tare');if(!val('slipno')||!val('slipveh')||gross<=0||tare<0||gross<tare){alert('Enter valid slip details');return}db.slips.unshift({id:val('slipno'),vehicle:val('slipveh'),gross,tare,weight:gross-tare});save();audit('Weigh bridge slip',val('slipno'));render()}

/* PBKDF2-SHA256 in plain JS - fallback when the browser blocks crypto.subtle (e.g. page opened over http://) */
const K256=new Int32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);

const W256=new Int32Array(64);
function sha256c(h,w){for(let i=0;i<16;i++)W256[i]=w[i];for(let i=16;i<64;i++){const a=W256[i-15],b=W256[i-2];W256[i]=(W256[i-16]+(((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3))+W256[i-7]+(((b>>>17)|(b<<15))^((b>>>19)|(b<<13))^(b>>>10)))|0}
 let a=h[0],b=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],k=h[7];
 for(let i=0;i<64;i++){const t1=(k+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+K256[i]+W256[i])|0,t2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&b)^(a&c)^(b&c)))|0;k=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
 return [(h[0]+a)|0,(h[1]+b)|0,(h[2]+c)|0,(h[3]+d)|0,(h[4]+e)|0,(h[5]+f)|0,(h[6]+g)|0,(h[7]+k)|0]}
function pbkdf2js(pw,salt,iters){
 let key=pw;if(key.length>64){/* long password: hash it first */const m=[...key,128];while(m.length%64!==56)m.push(0);const L=key.length*8;m.push(0,0,0,0,(L>>>24)&255,(L>>>16)&255,(L>>>8)&255,L&255);let h=H256.map(x=>x|0);for(let o=0;o<m.length;o+=64){const w=[];for(let i=0;i<16;i++)w.push((m[o+4*i]<<24)|(m[o+4*i+1]<<16)|(m[o+4*i+2]<<8)|m[o+4*i+3]);h=sha256c(h,w)}key=[];h.forEach(x=>key.push((x>>>24)&255,(x>>>16)&255,(x>>>8)&255,x&255))}
 const blk=x=>{const w=[];for(let i=0;i<16;i++){let v=0;for(let j=0;j<4;j++)v=(v<<8)|((4*i+j<key.length?key[4*i+j]:0)^x);w.push(v|0)}return w};
 const H0=H256.map(x=>x|0),is=sha256c(H0,blk(0x36)),os=sha256c(H0,blk(0x5c));
 const pad=[0,0,0,0,0,0,0];
 /* U1 = HMAC(pw, salt || 00000001) */
 const m=[...salt,0,0,0,1],tot=64+m.length;m.push(128);while((m.length+8)%64!==0)m.push(0);const L=tot*8;m.push(0,0,0,0,(L>>>24)&255,(L>>>16)&255,(L>>>8)&255,L&255);
 let h=is;for(let o=0;o<m.length;o+=64){const w=[];for(let i=0;i<16;i++)w.push((m[o+4*i]<<24)|(m[o+4*i+1]<<16)|(m[o+4*i+2]<<8)|m[o+4*i+3]);h=sha256c(h,w)}
 let u=sha256c(os,[...h,0x80000000,0,0,0,0,0,0,768]),t=u.slice();
 for(let n=1;n<iters;n++){const i1=sha256c(is,[...u,0x80000000,0,0,0,0,0,0,768]);u=sha256c(os,[...i1,0x80000000,0,0,0,0,0,0,768]);for(let j=0;j<8;j++)t[j]^=u[j]}
 const out=new Uint8Array(32);t.forEach((x,i)=>{out[4*i]=x>>>24;out[4*i+1]=x>>>16;out[4*i+2]=x>>>8;out[4*i+3]=x});return out}

async function sha256(s){return toB64(await crypto.subtle.digest('SHA-256',enc.encode(s)))}
async function hashPw(pw,saltB64){const salt=saltB64?fromB64(saltB64):crypto.getRandomValues(new Uint8Array(16));if(!window.crypto?.subtle)return {salt:toB64(salt),hash:toB64(pbkdf2js(enc.encode(pw),salt,150000))};const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);return {salt:toB64(salt),hash:toB64(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,256))}}
async function verifyPw(u,pw){if(u.pw!==undefined)return u.pw===pw;return (await hashPw(pw,u.salt)).hash===u.hash}
async function setPw(u,pw){const h=await hashPw(pw);u.salt=h.salt;u.hash=h.hash;delete u.pw}
async function kdf(pw,salt,use){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,use)}
async function encryptJSON(o,p){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await kdf(p,salt,['encrypt']);return JSON.stringify({app:'ERP',enc:1,salt:toB64(salt),iv:toB64(iv),ct:toB64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(o))))})}
async function decryptJSON(t,p){const o=JSON.parse(t),k=await kdf(p,fromB64(o.salt),['decrypt']);return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(o.iv)},k,fromB64(o.ct))))}
/* tamper-evident audit chain */
function h53(s){let a=0xdeadbeef,b=0x41c6ce57;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(16)}
function audit(action,detail){const e={date:new Date().toLocaleString(),user:current?.id||'System',action,detail:String(detail??'').slice(0,1500)};e.h=h53((db.audit[0]?.h||'0')+e.date+e.user+e.action+e.detail);db.audit.unshift(e);save()}
function auditOK(){let p='0';for(const e of [...db.audit].reverse()){if(!e.h)continue;if(e.h!==h53(p+e.date+e.user+e.action+e.detail))return false;p=e.h}return true}

const ROLE_PAGES={Admin:[...pages.filter(p=>p!=='Admin Panel'),'Backup & Restore','Admin Panel'],Manager:pages.filter(p=>p!=='Admin Panel'),'Accounts Staff':['Dashboard','Purchase','Sales','Payment Advice','Stock','Items & Masters','Weigh Bridge']};

/* login / session */
async function login(){const id=val('user').trim(),pw=document.getElementById('pass').value;
const L=db.lock[id]||{n:0,until:0};if(L.until>Date.now()){msg('Account is locked. Try again in '+Math.ceil((L.until-Date.now())/60000)+' minute(s).');return}
const u=db.users.find(x=>x.id===id);if(!u||u.active===false||!(await verifyPw(u,pw))){L.n++;if(L.n>=5){L.until=Date.now()+15*60000;L.n=0;audit('Account Locked',id)}db.lock[id]=L;audit('Failed Login',id);msg('Incorrect User ID or password.');return}
delete db.lock[id];if(u.pw!==undefined)await setPw(u,pw);current=u;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=u.id+' · '+u.role;addPwBtn();audit('Login','Signed in');section='Dashboard';render();arm();autoSnap();navigator.storage?.persist?.()}
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
async function createAdmin(){if(db.users.length)return;const id=val('newUser').trim(),pw=document.getElementById('newPass').value;if(!/^[A-Za-z0-9._-]{3,30}$/.test(id)){msg('User ID: 3-30 letters/numbers only.');return}if(!strong(pw)){msg(PMSG);return}const u={id,role:'Admin',active:true};await setPw(u,pw);db.users.push(u);audit('Admin Created',id);msg('Admin created. Please log in now.');document.getElementById('setup').classList.add('hidden');document.getElementById('signin').classList.remove('hidden')}
let idleT;function arm(){clearTimeout(idleT);if(!current)return;idleT=setTimeout(()=>{audit('Auto Logout','Idle timeout');current=null;location.reload()},(db.settings.idle||10)*60000)}
['click','keydown','mousemove','touchstart'].forEach(e=>addEventListener(e,arm,{passive:true}));

function addPwBtn(){const b=document.querySelector('.userbar');if(b.querySelector('#pwb'))return;const x=document.createElement('button');x.id='pwb';x.className='secondary';x.textContent='🔑 Password';x.onclick=()=>{section='Change Password';render()};b.insertBefore(x,b.lastElementChild)}
function pwPage(){return `<div class="pagehead"><h1>Change Password</h1></div><div class="card" style="max-width:480px">${current.mustChange?'<p class="error">Please set a new password.</p>':''}${field('Current Password','<input id="cp0" type="password" autocomplete="current-password">')}<br>${field('New Password','<input id="cp1" type="password" autocomplete="new-password">')}<br>${field('Confirm New Password','<input id="cp2" type="password" autocomplete="new-password">')}<div class="actions"><button onclick="changePw()">Update Password</button></div><p class="muted">${PMSG}</p></div>`}
async function changePw(){const a=val('cp0'),n=val('cp1'),c=val('cp2');if(!(await verifyPw(current,a))){alert('Current password is incorrect.');return}if(n!==c||n===a||!strong(n)){alert(n!==c?'Passwords do not match.':n===a?'New password must be different.':PMSG);return}await setPw(current,n);delete current.mustChange;audit('Password Changed',current.id);alert('Password changed.');section='Dashboard';render()}
function askPass(t){return new Promise(res=>{const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#0008;z-index:99;display:flex;align-items:center;justify-content:center';o.innerHTML=`<div class="card" style="width:min(380px,92vw)"><h2>${esc(t)}</h2><input type="password" id="apw" autocomplete="off"><div class="actions"><button id="aok">OK</button><button class="secondary" id="ano">Cancel</button></div></div>`;document.body.appendChild(o);const i=o.querySelector('#apw');i.focus();const d=v=>{o.remove();res(v)};o.querySelector('#aok').onclick=()=>d(i.value);o.querySelector('#ano').onclick=()=>d(null);i.onkeydown=e=>{if(e.key==='Enter')d(i.value)}})}
/* bills: edit / delete */
function editBill(type,id){const arr=type==='purchase'?db.purchases:db.sales,x=arr.find(b=>b.id===id);if(!x)return;if(current.role==='Accounts Staff'&&x.status!=='Draft'){alert('Only Draft bills can be edited. Contact a Manager/Admin.');return}editingBill={id,type};section=type==='purchase'?'Purchase':'Sales';render(true);Object.keys(x).forEach(k=>{const e=document.getElementById(k);if(e&&k!=='id')e.value=x[k]??''});calcBill();audit('Edit opened',type+' '+x.billno)}
async function deleteBill(type,id){if(current.role!=='Admin'){alert('Only Admin can delete.');return}const arr=type==='purchase'?db.purchases:db.sales,i=arr.findIndex(b=>b.id===id);if(i<0||!confirm('Permanently delete this bill?'))return;await snapPut('Before delete '+arr[i].billno).catch(()=>{});audit('Delete '+type,JSON.stringify(arr[i]));arr.splice(i,1);save();render()}

const admins=()=>db.users.filter(u=>u.role==='Admin'&&u.active!==false).length;
function admin(){return `<div class="pagehead"><h1>Admin Panel</h1></div><div class="card"><h2>Create User</h2><div class="formgrid">${field('User ID','<input id="uid" placeholder="accounts01">')}${field('Temporary Password','<input id="upw" type="password">')}${field('Role','<select id="urole"><option>Accounts Staff</option><option>Manager</option><option>Admin</option></select>')}</div><div class="actions"><button onclick="addUser()">Create User</button></div><p class="muted">New users must change the password at first login. ${PMSG}</p></div>
<div class="card" style="margin-top:14px"><h2>User Accounts</h2><div class="tablewrap"><table><tr><th>User ID</th><th>Role</th><th>Status</th><th>Actions</th></tr>${db.users.map((x,i)=>`<tr><td>${esc(x.id)}</td><td><select onchange="setRole(${i},this.value)">${['Admin','Manager','Accounts Staff'].map(r=>`<option${r===x.role?' selected':''}>${r}</option>`).join('')}</select></td><td>${x.active===false?'Disabled':'Active'}${x.mustChange?' · Password change pending':''}${(db.lock[x.id]?.until||0)>Date.now()?' · 🔒 Locked':''}</td><td><button class="secondary" onclick="toggleUser(${i})">${x.active===false?'Enable':'Disable'}</button> <button class="secondary" onclick="resetUser(${i})">Reset / Unlock</button> <button class="danger" onclick="delUser(${i})">Delete</button></td></tr>`).join('')}</table></div></div>

async function addUser(){const id=val('uid').trim(),pw=val('upw');if(!/^[A-Za-z0-9._-]{3,30}$/.test(id)||db.users.some(x=>x.id.toLowerCase()===id.toLowerCase())){alert('Enter a unique User ID (3-30 letters/numbers).');return}if(!strong(pw)){alert(PMSG);return}const u={id,role:val('urole'),active:true,mustChange:true};await setPw(u,pw);db.users.push(u);audit('Create user',id+' ('+u.role+')');render()}
function setRole(i,r){const u=db.users[i];if(u.role==='Admin'&&r!=='Admin'&&admins()<2){alert('The last Admin cannot be changed.');return render()}audit('Role change',u.id+' → '+r);u.role=r;save();render()}
function toggleUser(i){const u=db.users[i];if(u.id===current.id||(u.role==='Admin'&&u.active!==false&&admins()<2)){alert('This user cannot be disabled.');return}u.active=u.active===false;audit(u.active?'Enable user':'Disable user',u.id);save();render()}
async function resetUser(i){const u=db.users[i],p=await askPass('Temporary Password: '+u.id);if(!p)return;if(!strong(p)){alert(PMSG);return}await setPw(u,p);u.mustChange=true;delete db.lock[u.id];audit('Password reset',u.id);render()}
function delUser(i){const u=db.users[i];if(u.id===current.id||(u.role==='Admin'&&u.active!==false&&admins()<2)){alert('This user cannot be deleted.');return}if(!confirm(u.id+' Delete this user?'))return;db.users.splice(i,1);audit('Delete user',u.id);save();render()}
/* snapshots (IndexedDB) */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('tsr_erp_snap',1);r.onupgradeneeded=()=>r.result.createObjectStore('s',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function snapList(){const d=await idb();return new Promise(res=>{const q=d.transaction('s').objectStore('s').getAll();q.onsuccess=()=>res(q.result.sort((a,b)=>b.id-a.id))})}
async function snapDel(id){const d=await idb();return new Promise(r=>{const t=d.transaction('s','readwrite');t.objectStore('s').delete(id);t.oncomplete=r})}
async function snapPut(label){const d=await idb();await new Promise((res,rej)=>{const t=d.transaction('s','readwrite');t.objectStore('s').put({id:Date.now(),label,created:new Date().toLocaleString(),json:JSON.stringify(db)});t.oncomplete=res;t.onerror=()=>rej(t.error)});for(const x of (await snapList()).slice(15))await snapDel(x.id)}
function autoSnap(){if(db.settings.lastSnap!==today())snapPut('Daily auto').then(()=>{db.settings.lastSnap=today();save()}).catch(()=>{})}
async function snapNow(){await snapPut('Manual');drawSnaps()}
async function snapRestore(id){const x=(await snapList()).find(s=>s.id===id);if(x)applyRestore(JSON.parse(x.json),'Snapshot '+x.created)}
async function snapDl(id){const x=(await snapList()).find(s=>s.id===id);if(x)dl('ERP_Snapshot_'+id+'.json',x.json,'application/json')}
async function snapRm(id){if(confirm('Delete this snapshot?')){await snapDel(id);drawSnaps()}}
async function drawSnaps(){const el=document.getElementById('snaps');if(!el)return;try{const a=await snapList();el.innerHTML=a.length?`<table><tr><th>Date</th><th>Reason</th><th>Size</th><th></th></tr>${a.map(x=>`<tr><td>${esc(x.created)}</td><td>${esc(x.label)}</td><td>${(x.json.length/1024).toFixed(0)} KB</td><td><button class="secondary" onclick="snapRestore(${x.id})">Restore</button> <button class="secondary" onclick="snapDl(${x.id})">Download</button> <button class="danger" onclick="snapRm(${x.id})">Delete</button></td></tr>`).join('')}</table>`:'<p class="muted">No snapshots.</p>'}catch(e){el.textContent='Snapshots are unavailable.'}}
/* backup / restore */
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'application/octet-stream'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
async function pack(){return {app:'ERP',v:3,created:new Date().toISOString(),by:current.id,sum:await sha256(JSON.stringify(db)),data:db}}
function mark(t){db.settings.lastDl=today();audit('Backup Download',t);render()}
async function backupEnc(){if(current.role!=='Admin')return;const p=await askPass('Backup passphrase (min 8 characters) - if forgotten the backup cannot be opened!');if(!p)return;if(p.length<8){alert('Minimum 8 characters.');return}if(p!==await askPass('Re-enter passphrase')){alert('Passphrases do not match.');return}dl('ERP_Backup_'+stamp()+'.tsrbak',await encryptJSON(await pack(),p));mark('Encrypted')}
async function backupPlain(){if(current.role!=='Admin')return;if(!confirm('A plain backup is not encrypted. Will you store it safely?'))return;dl('ERP_Backup_'+stamp()+'.json',JSON.stringify(await pack(),null,1),'application/json');mark('Plain')}
async function restoreFile(inp){if(current.role!=='Admin')return;const f=inp.files[0];if(!f)return;const t=await f.text();inp.value='';let o;try{o=JSON.parse(t);if(o.enc){const p=await askPass('Backup Passphrase');if(!p)return;o=await decryptJSON(t,p)}}catch(e){alert('Could not open backup: wrong passphrase or damaged file.');return}
const d=o.data||o;if(o.sum&&o.sum!==await sha256(JSON.stringify(d))){alert('Checksum mismatch - the file is damaged.');return}applyRestore(d,f.name)}
async function applyRestore(d,src){if(!d||['users','purchases','sales','payments','parties','items'].some(k=>!Array.isArray(d[k]))||!d.users.some(u=>u.role==='Admin')){alert('This is not a valid ERP backup.');return}
if(!confirm(`Restore: ${src}\nPurchase ${d.purchases.length} · Sales ${d.sales.length} · Payments ${d.payments.length}\nCurrent data will be replaced. Continue?`))return;await snapPut('Before restore').catch(()=>{});audit('Restore',src);db=d;fill();audit('Restore done',src);alert('Restore complete. Please log in again.');location.reload()}
function exportTable(k){const r=inDR(db[k]||[]);if(!r.length){alert('No data.');return}const cols=[...new Set(r.flatMap(x=>Object.keys(x)))].filter(c=>c!=='h'),q=v=>{v=typeof v==='object'&&v?JSON.stringify(v):String(v??'');if(/^[=+@]|^-(?!\d)/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};dl('ERP_'+k+'_'+today()+'.csv','\ufeff'+[cols.map(q).join(','),...r.map(x=>cols.map(c=>q(x[c])).join(','))].join('\n'),'text/csv');audit('Export CSV',k)}
function backupPage(){setTimeout(drawSnaps,0);return `<div class="pagehead"><h1>Backup & Restore</h1><span class="pill">Last download: ${db.settings.lastDl||'Never'}</span></div><div class="grid"><div class="card"><h2>🔐 Encrypted Backup</h2><p class="muted">AES-256 + passphrase. Keep it on a pen drive / Google Drive. (Recommended)</p><div class="actions"><button onclick="backupEnc()">Download</button></div></div><div class="card"><h2>📄 Plain JSON Backup</h2><p class="muted">Not encrypted. Keep only in a safe place.</p><div class="actions"><button class="secondary" onclick="backupPlain()">Download</button></div></div><div class="card"><h2>♻ Restore</h2><p class="muted">Select a .tsrbak or .json file. A snapshot is taken automatically before restoring.</p><input type="file" accept=".tsrbak,.json" onchange="restoreFile(this)"></div></div>
<div class="card" style="margin-top:14px"><h2>Excel / CSV Export</h2><div class="actions">${['purchases','sales','payments','parties','items','vehicles','brokers','branches','slips','wbf','advices','audit'].map(k=>`<button class="secondary" onclick="exportTable('${k}')">${k}</button>`).join('')}</div></div>
<div class="card" style="margin-top:14px"><h2>Auto Snapshots (in this browser)</h2><div class="actions"><button onclick="snapNow()">Snapshot Now</button></div><div id="snaps" class="tablewrap"></div><p class="muted">Taken automatically every day (last 15 kept). If browser data is cleared these are lost too, so file backups are essential.</p></div>`}
</script>
<script>
/* ===== V4: screens modelled on the reference screenshots (English only) ===== */
const Q=id=>document.getElementById(id),pad=(n,w)=>String(n).padStart(w,'0');
const opts=(a,s,ph)=>(ph===false?'':`<option value="">${ph||'— Select —'}</option>`)+a.map(x=>`<option${x===s?' selected':''}>${esc(x)}</option>`).join('');
const sel=(id,a,v,ph,ex)=>`<select id="${id}" ${ex||''}>${opts(a,v,ph)}</select>`;
const ia=(id,ph,v,t,ex)=>`<input id="${id}" ${t?`type="${t}" `:''}placeholder="${esc(ph||'')}" value="${esc(v??'')}" ${ex||''}>`;
const nm=k=>db[k].map(x=>x.name),RO='class="readonly" readonly';
function fill(){['users','purchases','sales','parties','items','branches','vehicles','brokers','payments','slips','audit','wbf','advices'].forEach(k=>db[k]=db[k]||[]);db.settings=db.settings||{idle:10};db.lock=db.lock||{}}fill();
const tbl=(h,rows)=>`<div class="tablewrap"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>${rows.length?'':'<p class="muted">No records yet.</p>'}`;
function consume(id,w){const x=db.wbf.find(b=>b.wbf===id);if(x){x.remaining=Math.max(0,x.remaining-w);save()}}
/* Branches */
let bEdit=null;
function master(){const b=bEdit!=null?db.branches[bEdit]:{};return `<div class="pagehead"><h1>Branches</h1></div><div class="card"><h2>${bEdit!=null?'Edit':'Add'} Branch</h2><div class="formgrid">${field('Branch Name *',ia('bn','e.g. Main Branch',b.name))}${field('Branch Code',ia('bc','e.g. MAIN',b.code))}${field('Location',ia('bl','e.g. HQ',b.location))}</div><div class="actions"><button onclick="addBranch()">${bEdit!=null?'Update':'Add'} Branch</button></div></div><div class="card" style="margin-top:14px"><h2>All Branches</h2>${tbl(['#','Branch Name','Code','Location','Created','Actions'],db.branches.map((x,i)=>[i+1,`<b>${esc(x.name)}</b>`,esc(x.code),esc(x.location),esc(x.created||''),`<button class="secondary" onclick="editBranch(${i})">Edit</button>`]))}</div>`}
function addBranch(){const n=val('bn').trim();if(!n){alert('Branch name is required.');return}const o={name:n,code:val('bc').trim().toUpperCase(),location:val('bl').trim()};if(bEdit!=null){Object.assign(db.branches[bEdit],o);audit('Edit branch',n)}else{o.created=new Date().toISOString().slice(0,19).replace('T',' ');db.branches.push(o);audit('Add branch',n)}bEdit=null;save();render()}
function editBranch(i){bEdit=i;render()}
/* Sales bill with line items */
let SL=[{}],SLT={};
const li=(i,k,n,l,w)=>`<input data-i="${i}" data-k="${k}" ${n?'type="number" step=".01" ':''}value="${esc(l[k]??'')}" oninput="slIn(this)" style="min-width:${w||70}px">`;
const slRows=()=>SL.map((l,i)=>`<tr><td>${i+1}</td><td><select data-i="${i}" data-k="item" onchange="slIn(this)" style="min-width:130px">${opts(nm('items'),l.item)}</select></td><td>${li(i,'batch',0,l)}</td><td>${li(i,'kgs',1,l)}</td><td>${li(i,'rate',1,l)}</td><td>${li(i,'qty',1,l)}</td><td>${li(i,'loc',0,l,110)}</td><td>${li(i,'tax',1,l,60)}</td><td id="ta${i}"></td><td id="lt${i}"></td><td><button class="danger" onclick="slDel(${i})">×</button></td></tr>`).join('');
function slIn(e){SL[+e.dataset.i][e.dataset.k]=e.value;slCalc()}
function slAdd(){SL.push({});Q('slines').innerHTML=slRows();slCalc()}
function slDel(i){if(SL.length>1)SL.splice(i,1);Q('slines').innerHTML=slRows();slCalc()}
function slCalc(){if(!Q('slines'))return;let sub=0,tax=0,kg=0;SL.forEach((l,i)=>{const b=(+l.qty||0)*(+l.rate||0),t=b*(+l.tax||0)/100;sub+=b;tax+=t;kg+=(+l.qty||0)*(+l.kgs||0);Q('ta'+i).textContent=t.toFixed(2);Q('lt'+i).textContent=(b+t).toFixed(2)});const grand=sub+tax-(+val('sfr'))-(+val('sdi'))+(+val('sro')),inv=grand-(+val('std'));SLT={sub,tax,kg,grand,inv};Q('swt').value=(kg/1000).toFixed(3);[['t1',sub],['t2',tax],['t3',+val('sfr')],['t4',+val('sdi')],['t5',+val('sro')],['t6',+val('std')],['t7',grand],['t8',inv]].forEach(([k,v])=>Q(k).textContent=money(v))}
function slLoad(){const s=[...db.slips].find(x=>x.vehicle===val('sveh'));if(s)Q('sslip').value=s.id;else alert('No weigh bridge slip found for this vehicle.')}
function salesPage(){const r=editingBill?.type==='sales'?db.sales.find(x=>x.id===editingBill.id)||{}:{},g=(k,d)=>r[k]??d;
return `<div class="pagehead"><h1>Sales Bills</h1></div><div class="card"><h2>${r.id?'Edit':'New'} Sales Bill</h2>
<div class="section">Branch</div><div class="formgrid">${field('Branch',sel('sbr',nm('branches'),g('branch',''),'— Select Branch —'))}${field('Sales Serial',ia('sser','',g('serial','SB-'+pad(db.sales.length+1,5)),'',RO))}</div>
<div class="section">Bill Information</div><div class="formgrid">${field('Bill Date *',ia('sdate','',g('date',today()),'date'))}${field('Sales Type *',sel('stype',['Local Sales','Inter-State Sales','Export Sales'],g('stype','')))}${field('Category',sel('scat',['Rice','Broken Rice','Paddy','By Product','Other'],g('category',''),'— None —'))}${field('Out Pass Number *',ia('sout','OP-XXXX',g('billno','')))}${field('PO Number',ia('spo','Customer PO reference',g('po','')))}${field('Status',sel('sstat',['Draft','Posted','Cancelled'],g('status','Draft'),false))}</div><div class="field" style="margin-top:12px"><label>Sales Order Numbers (comma separated)</label>${ia('sso','e.g. SO-001, SO-002',g('orders',''))}</div>
<div class="section">Customer</div><div class="formgrid">${field('Customer Name *',sel('scust',nm('parties'),g('party',''),'Select from master...'))}${field('Customer City',ia('scity','City',g('city','')))}${field('Vehicle Number',sel('sveh',nm('vehicles'),g('vehicle',''),'Select vehicle master'))}${field('Total Weight (MT) (auto)',ia('swt','','0.000','',RO))}${field('Payment Terms',ia('sterm','e.g. 30 days',g('terms','')))}</div>
<div class="section">Line Items</div><div class="tablewrap"><table><tr><th>#</th><th>Item *</th><th>Batch No.</th><th>Kgs/Unit</th><th>Rate (₹) *</th><th>Qty *</th><th>Loading Location</th><th>Tax %</th><th>Tax Amt</th><th>Line Total</th><th></th></tr><tbody id="slines">${slRows()}</tbody></table></div><div class="actions"><button class="secondary" onclick="slAdd()">+ Add Item</button></div>
<div class="section">Charges & Summary</div><div class="formgrid">${field('Less Lorry Freight (₹)',ia('sfr','',g('freight',0),'number','oninput="slCalc()"'))}${field('Less Discount (₹)',ia('sdi','',g('discount',0),'number','oninput="slCalc()"'))}${field('Round Off (₹)',ia('sro','',g('roundoff',0),'number','oninput="slCalc()"'))}${field('TDS (₹)',ia('std','',g('tds',0),'number','oninput="slCalc()"'))}${field('Books Bill Ref',ia('sbr2','Books Bill Ref',g('booksRef','')))}${field('Books Bill Total',ia('sbt','Books Bill Total',g('booksTotal','')))}</div>
<div class="card" style="background:var(--mint);margin-top:14px">${[['Item Subtotal','t1'],['Total Tax','t2'],['Less Lorry Freight','t3'],['Less Discount','t4'],['Round Off','t5'],['TDS','t6']].map(x=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${x[0]}</span><span id="${x[1]}"></span></div>`).join('')}<div class="total" style="display:flex;justify-content:space-between;border-top:2px solid var(--green2);padding-top:8px"><span>Grand Total</span><span id="t7"></span></div><div class="total" style="display:flex;justify-content:space-between"><span>Invoice Total</span><span id="t8"></span></div></div>
<div class="section">Weigh Bridge</div><div class="field"><label>Weigh Bridge Slip (required to post)</label><div class="actions" style="margin:0"><select id="sslip" style="flex:1">${'<option value="">— Select Slip —</option>'+db.slips.map(x=>`<option value="${esc(x.id)}"${x.id===r.slip?' selected':''}>${esc(x.id)} · ${esc(x.vehicle)} · ${x.weight} KG</option>`).join('')}</select><button class="secondary" onclick="slLoad()">Load for Vehicle</button></div></div>
<div class="field" style="margin-top:12px"><label>Notes</label><textarea id="snotes" placeholder="Optional remarks">${esc(g('notes',''))}</textarea></div><div class="actions"><button onclick="saveSales()">Save Sales Bill</button><button class="secondary" onclick="render()">Clear</button></div></div><div class="card" style="margin-top:16px"><h2>Recent Sales Bills</h2>${tableBills(db.sales,'sales')}</div>`}
function saveSales(){slCalc();if(!val('sdate')||!val('stype')||!val('sout')||!val('scust')||!SL.length||SL.some(l=>!l.item||!(+l.rate>0)||!(+l.qty>0))){alert('Fill Bill Date, Sales Type, Out Pass Number, Customer and valid line items (item, rate, qty).');return}if(val('sstat')==='Posted'&&!val('sslip')){alert('A weigh bridge slip is required to post a bill.');return}
const old=editingBill?.type==='sales'?db.sales.find(x=>x.id===editingBill.id):null,T=SLT,rec={id:old?.id||Date.now(),serial:val('sser'),branch:val('sbr'),date:val('sdate'),stype:val('stype'),category:val('scat'),billno:val('sout'),gate:val('sout'),po:val('spo'),status:val('sstat'),orders:val('sso'),party:val('scust'),city:val('scity'),vehicle:val('sveh'),terms:val('sterm'),lines:JSON.parse(JSON.stringify(SL)),item:SL[0].item+(SL.length>1?' (+'+(SL.length-1)+')':''),weight:T.kg,net:T.kg,freight:+val('sfr'),discount:+val('sdi'),roundoff:+val('sro'),tds:+val('std'),booksRef:val('sbr2'),booksTotal:val('sbt'),slip:val('sslip'),notes:val('snotes'),amount:+T.inv.toFixed(2)};
if(old){Object.assign(old,rec);audit('Edit sales',rec.billno)}else{db.sales.unshift(rec);audit('Create sales',rec.billno);if(rec.slip)consume(rec.slip,rec.weight)}editingBill=null;save();alert('Sales bill saved.');render()}
const _eb=window.editBill,_sb=window.saveBill;
window.editBill=function(t,id){if(t!=='sales')return _eb(t,id);const x=db.sales.find(b=>b.id===id);if(!x)return;if(current.role==='Accounts Staff'&&x.status!=='Draft'){alert('Only Draft bills can be edited. Contact a Manager/Admin.');return}SL=JSON.parse(JSON.stringify(x.lines||[{item:x.item,qty:1,kgs:x.weight,rate:x.amount}]));editingBill={id,type:'sales'};section='Sales';render(true)};
window.saveBill=function(t){const s=val('slip'),w=+val('weight'),n=db.purchases.length;_sb(t);if(t==='purchase'&&db.purchases.length>n&&s)consume(s,w)};
V['Sales']=()=>{if(!editingBill)SL=[{}];setTimeout(slCalc,0);return salesPage()};
/* Stock */
function stockPage(){const m={},add=(n,k,v)=>{if(n)(m[n]=m[n]||{b:0,s:0})[k]+=v};db.purchases.forEach(x=>add(x.item,'b',+x.net||+x.weight||0));db.sales.forEach(x=>x.lines?x.lines.forEach(l=>add(l.item,'s',(+l.qty||0)*(+l.kgs||0))):add(x.item,'s',+x.net||+x.weight||0));const f=n=>n.toLocaleString('en-IN');return `<div class="pagehead"><h1>Stock</h1><span class="pill">Purchase − Sales</span></div><div class="card">${tbl(['Item','Purchased KG','Sold KG','Available KG'],Object.entries(m).map(([n,v])=>[esc(n),f(v.b),f(v.s),`<b>${f(v.b-v.s)}</b>`]))}</div>`}
/* Weigh Bridge (WBF) */
let WF='all';
function weighbridge(){const f=(l,id,ph,t)=>field(l,ia(id,ph,'',t)),L=db.wbf.filter(x=>x.remaining>0),inw=L.filter(x=>x.type==='Inward').length,out=L.length-inw,rows=L.filter(x=>WF==='all'||(WF==='in'?x.type==='Inward':x.type==='Outward'));
return `<div class="pagehead"><h1>Weight Machine Entry (WBF – Weigh Bridge + Freight)</h1></div><div class="card"><h2>New Weight Machine Entry</h2>
<div class="section">Basic Information</div><div class="formgrid">${field('Common Serial No.',ia('wcsn','','Auto (from Sale Order)','',RO))}${field('Date *',ia('wdate','',today(),'date'))}${field('Entry Type *',sel('wtype',['Outward (Sales / Out Pass)','Inward (Purchase / Gate Pass)'],'Outward (Sales / Out Pass)','',false))}${field('Vehicle Number *',ia('wveh','MH-XX-XXXX'))}${f('Driver Name','wdrv','Driver name')}${f('Driver Contact','wdc','Phone number')}${f('Arrival Time','warr','','time')}${f('Owner Name','wown','Vehicle owner name')}${f('Owner Contact','woc','Phone number')}${f('Broker Name','wbro','Broker name')}</div>
<div class="section">Weight Machine Details</div><div class="formgrid">${f('Weight Machine Token No. *','wtok','Token number')}${field('Material Name *',sel('wmat',nm('items'),'','— Select Material —'))}${f('Loading Location *','wunl','Location')}</div>
<div class="section">Weigh Bridge Weights</div><div class="formgrid">${field('Gross Weight (KG) *',ia('wgr','0.00','','number','oninput="wNet()"'))}${field('Tare Weight (KG) *',ia('wta','0.00','','number','oninput="wNet()"'))}${field('Net Weight (KG)',ia('wnet','Auto','','',RO))}${f('Weight Shortage (KG)','wsh','Shortage if any','number')}</div>
<div class="section">Quality Inspection Report</div><div class="formgrid">${f('Moisture (%)','wmo','0.00','number')}${f('Quality Shortage','wqs','Shortage details')}${f('Quality Ratio','wqr','e.g. 65:35')}${f('Other','wot','Other observations')}</div>
<div class="section">Pass Numbers</div><div class="formgrid">${f('Out Pass Number','wout','OPN/6/XXX')}${f('Gate Pass / In Pass Number','wgate','GP-XXX')}</div>
<div class="section">Freight</div><div class="formgrid">${field('Freight Type *',sel('wft',['Lorry Freight','Own Vehicle','No Freight'],'Lorry Freight','',false))}${f('Freight Amount (₹) *','wfa','0.00','number')}${field('Payment Mode',sel('wpm',['Cash','Bank Transfer','Credit']))}${field('TDS Applicable',sel('wtds',['No','Yes'],'No','',false))}${f('Advance Amount (₹)','wadv','0.00','number')}${f('From Location','wfrom','Origin')}${f('To Location','wto','Destination')}</div>
<div class="field" style="margin-top:12px"><label>Notes</label><textarea id="wnotes" placeholder="Optional notes"></textarea></div><div class="actions"><button onclick="saveWbf()">Prepare</button><button class="secondary" onclick="render()">Clear</button></div></div>
<div class="card" style="margin-top:14px"><h2>Pending Allocation</h2><div class="actions" style="margin:0 0 8px"><button class="${WF==='in'?'':'secondary'}" onclick="WF='in';render()">↓ Pending → Purchase (${inw})</button><button class="${WF==='out'?'':'secondary'}" onclick="WF='out';render()">↑ Pending → Sales (${out})</button><button class="secondary" onclick="WF='all';render()">Refresh</button></div><p class="muted">Weighments with unallocated weight remaining. Rows older than 7 days are highlighted.</p>${tbl(['CSN#','WBF#','Date','Age','Vehicle','Material','Net (KG)','Remaining (KG)','Freight (₹)','Prep Status','Allocate'],rows.map(x=>{const d=Math.floor((Date.now()-new Date(x.date))/864e5),o=d>7;return [esc(x.csn),esc(x.wbf),esc(x.date),o?`<b style="color:#b45309">${d}d</b>`:d+'d',`<b>${esc(x.vehicle)}</b>`,esc(x.material),x.net.toLocaleString('en-IN'),`<b>${x.remaining.toLocaleString('en-IN')}</b>`,x.freight.toLocaleString('en-IN'),esc(x.status),`<button class="secondary" onclick="allocate('${esc(x.wbf)}')">→ ${x.type==='Inward'?'Purchase':'Sales'} Bill</button>`]}))}</div>`}
function wNet(){const g=+val('wgr'),t=+val('wta');Q('wnet').value=g>t?(g-t).toFixed(2):''}
function saveWbf(){const g=+val('wgr'),t=+val('wta'),sh=+val('wsh')||0;if(!val('wveh').trim()||!val('wtok').trim()||!val('wmat')||!val('wunl').trim()||!(g>0)||!(t>=0)||g<=t||val('wfa')===''&&val('wft')==='Lorry Freight'){alert('Fill Vehicle, Token No., Material, Unloading Location, valid Gross/Tare weights and Freight Amount.');return}
const veh=val('wveh').trim().toUpperCase(),net=g-t-sh,rec={id:Date.now(),csn:val('wcsn'),wbf:'WBF-'+pad(db.wbf.length+1,4),date:val('wdate'),type:val('wtype').startsWith('Out')?'Outward':'Inward',vehicle:veh,driver:val('wdrv'),driverContact:val('wdc'),arrival:val('warr'),owner:val('wown'),ownerContact:val('woc'),broker:val('wbro'),token:val('wtok'),material:val('wmat'),unloading:val('wunl'),gross:g,tare:t,shortage:sh,net,remaining:net,moisture:+val('wmo'),qualityShortage:val('wqs'),qualityRatio:val('wqr'),other:val('wot'),outPass:val('wout'),gatePass:val('wgate'),freightType:val('wft'),freight:+val('wfa')||0,payMode:val('wpm'),tds:val('wtds'),advance:+val('wadv')||0,from:val('wfrom'),to:val('wto'),notes:val('wnotes'),status:'prepared'};

 return i>0?h.slice(0,i)+strip+h.slice(i):strip+h;

window.fcClose=()=>document.getElementById('fcm')?.remove();

 const r=(l,v)=>'<div class="field"><label>'+l+'</label><b>'+esc(v)+'</b></div>';

 const calc=(+p.weight||0)*(+p.rate||0),fin=w?(+w.net||0):0,vehOK=!w||!p.vehicle||!w.vehicle||String(p.vehicle).toUpperCase()===String(w.vehicle).toUpperCase();

  ln(Math.abs(calc-(+p.amount||0))<=1,'Bill Weight × Rate = '+inr(calc)+' &nbsp;|&nbsp; Total Amount = '+inr(p.amount)),

  w?ln(fin>0,'Final weight '+n0(fin)+' KG vs bill weight '+n0(p.weight)+' KG → difference '+((v)=>v>0?'+'+n0(v):v<0?'-'+n0(-v):'0')(+(fin-(+p.weight||0)).toFixed(2))+' KG'):''].join('');
 const o=document.createElement('div');o.id='fcm';
 o.style.cssText='position:fixed;inset:0;background:#0008;z-index:99;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px';
 o.innerHTML='<div class="card" style="width:min(920px,100%)"><div class="pagehead" style="margin:0"><h2 style="margin:0">Final Check – '+esc(p.serial)+' · '+esc(p.gate)+'</h2>'+chkPill(p)+'</div>'+
 '<div class="sec">Bill & Gate Entry</div><div class="formgrid">'+r('Gate Entry',p.gate)+r('Bill No.',p.billno)+r('Bill Date',p.date)+r('Unloading Date',p.unloadDate||'—')+r('Vehicle',p.vehicle||'—')+r('Party',p.party)+r('Party Address',p.paddr||p.city||'—')+r('Party GST',p.pgst||'—')+r('Item',p.item)+r('Bags',n0(p.bags))+r('Bill Weight (KG)',n0(p.weight))+r('Rate (₹/KG)',p.rate)+r('Total Amount',inr(p.amount))+'</div>'+
 '<div class="sec">Weighment</div>'+(w?'<div class="formgrid">'+r('WBF No.',w.wbf)+r('Date',w.date)+r('Gross (KG)',n0(w.gross))+r('Tare (KG)',n0(w.tare))+r('Net (KG)',n0(w.netWeight))+r('Weight Difference (KG)',((v)=>v>0?'+'+n0(v):v<0?'-'+n0(-v):'0')(+((+w.net||0)-(+p.weight||0)).toFixed(2)))+r('Final Weight (KG)',n0(w.net))+r('Freight',inr(w.freight))+r('Round Off',inr(p.roundoff))+r('Broker Commission',inr(p.commission))+r('Payment Value',inr(window.payParts?payParts(p).pv:0))+r('Moisture %',n0(w.moisture))+((w.qualityShortage||w.qualityRatio||w.other)?r('Quality Shortage',w.qualityShortage||'—')+r('Quality Ratio',w.qualityRatio||'—')+r('Other',w.other||'—'):'')+'</div>':'<p class="muted">Not weighed yet – do the weighment in Weigh Bridge first.</p>')+
 '<div class="sec">Payment Advice</div>'+(A.length?A.map(a=>'<div>💳 <b>'+esc(a.id)+'</b> · '+esc(a.date)+' · Net payable <b>'+inr(a.net)+'</b></div>').join(''):'<p class="muted">No payment advice yet. After <b>Entry OK</b>, create it from the Purchase list or Payment Advice screen.</p>')+
 '<div class="sec">Automatic checks</div>'+auto+
 '<div class="sec">Final Check (Accounts Manager)</div>'+
 [['fc1','Bill details (party, bill no., date, item) are correct'],['fc2','Weighment, shortage and vehicle are correct'],['fc3','Rate, amount, freight and deductions are correct']].map(([i,t])=>'<label style="display:flex;gap:8px;align-items:center;padding:4px 0;text-transform:none;font-size:14px"><input type="checkbox" id="'+i+'" style="width:auto" '+(can?'':'disabled')+(p.check==='ok'?' checked':'')+'> '+t+'</label>').join('')+
 '<div class="field" style="margin-top:10px"><label>Remarks / correction needed</label><textarea id="fcn" '+(can?'':'readonly')+'>'+esc(p.checkNote||'')+'</textarea></div>'+
 (p.check==='ok'?'<p class="muted">Marked Entry OK by <b>'+esc(p.checkBy||'')+'</b> on '+esc(p.checkAt||'')+'</p>':'')+
 (can?'':'<p class="muted">'+(!ready(p)?'The weighment is not closed yet, so final check is not possible.':'Only the Accounts Manager (Manager / Admin login) can do the final check.')+'</p>')+
 '<div class="actions">'+(can&&p.check!=='ok'?'<button onclick="fcDone('+p.id+',\'ok\')">✔ Entry OK</button><button class="secondary" onclick="fcDone('+p.id+',\'correction\')">✎ Needs Correction</button>':'')+
 (current&&current.role==='Admin'&&p.check==='ok'&&!A.length?'<button class="secondary" onclick="fcDone('+p.id+',\'pending\')">🔓 Re-open (Admin)</button>':'')+
 (can&&p.check==='ok'&&A.length?'<span class="muted">Payment advice already made – cannot re-open.</span>':'')+
 (current&&current.role==='Admin'?'<button class="secondary" onclick="editBill(\'purchase\','+p.id+');fcClose()">✎ Edit Bill</button><button class="danger" onclick="fcDelete('+p.id+')">🗑 Delete</button>':'')+'<button class="secondary" onclick="pbPdf('+p.id+')">🖨 PDF</button><button class="secondary" onclick="fcClose()">Close</button></div></div>';
 document.body.appendChild(o);
};
window.fcDone=(id,st)=>{
 const p=db.purchases.find(x=>x.id===id);if(!p)return;
 if(!canCheck()){alert('Only the Accounts Manager (Manager / Admin login) can do the final check.');return}
 if(!ready(p)){alert('The weighment must be closed in Weigh Bridge first.');return}
 if(p.approval==='Rejected'){alert('This bill is Rejected. Edit it and click Resubmit first.');return}
 const note=(document.getElementById('fcn')?.value||'').trim();
 if(st==='ok'&&!['fc1','fc2','fc3'].every(i=>document.getElementById(i)?.checked)){alert('Tick all three checks before marking Entry OK.');return}
 if(st==='correction'&&!note){alert('Write what needs to be corrected in Remarks.');return}

 p.check=st==='pending'?'':st;p.checkBy=current.id;p.checkAt=nowS();p.checkNote=st==='ok'?note:(st==='correction'?note:'');

 save();fcClose();render();

<script>
/* ===== V15: 3-stage flow  ① Inward → Gate Entry   ② Weigh Bridge (weigh + Close)   ③ Purchase (Accounts Manager final check) ===== */
(()=>{
const wOf=p=>(db.wbf||[]).find(w=>w.purchaseId===p.id);
const isClosed=w=>!!w&&w.closed!==false;                 /* old weighments (before this update) count as closed */
const ready=p=>p.wb!=='Pending'&&(!wOf(p)||isClosed(wOf(p)));
const advOf=p=>(db.advices||[]).filter(a=>(a.bills||[]).includes(p.id));
const canMgr=()=>!!current&&(current.role==='Admin'||current.role==='Manager');
const nowS=()=>new Date().toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});
const stage=p=>p.wb==='Pending'?'<span class="apv">🚪 Gate done · waiting for weighment</span>':!ready(p)?'<span class="apv">⚖ Weighed · close it in Weigh Bridge</span>':p.check==='ok'?'<span class="apv g">✔ Entry OK</span>':p.check==='correction'?'<span class="apv" style="background:#fde8e8;color:#b42318">✎ Correction needed</span>':'<span class="apv" style="background:#e8f0fe;color:#1d4ed8">🧾 In Purchase · final check pending</span>';
const flow=n=>{const s=[['Inward → Gate Entry','Enter gate entry & finish'],['Weigh Bridge','Weigh, finalise weights & Close'],['Purchase','Accounts Manager final check → Entry OK']];
 return '<div class="card" style="margin:0 0 14px;padding:10px 14px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+s.map((x,i)=>'<div style="flex:1;min-width:190px;border-radius:10px;padding:8px 12px;'+(i+1===n?'background:#522295;color:#fff':'background:#f2f0fa;color:#444')+'"><b>'+(i+1)+'. '+x[0]+'</b><br><small>'+x[1]+'</small></div>').join('<span style="font-size:18px">➜</span>')+'</div></div>'};
const addAfterHead=(h,x)=>h.replace('</h1></div>','</h1></div>'+x);

/* ① Gate Entry: stage column */
const _G=V['Gate Entry'];
V['Gate Entry']=()=>{
 let h=_G();
 h=h.replace(/<tr>(?:(?!<\/tr>)[\s\S])*?<\/tr>/g,row=>{
  const m=/editBill\('purchase',(\d+)\)/.exec(row);if(!m)return row;
  const p=db.purchases.find(x=>x.id==m[1]);if(!p)return row;
  return row.replace('<td class="muted">','<td class="nw">'+stage(p)+'</td><td class="muted">');
 }).replace('<th class="nw">Created By</th>','<th class="nw">Stage</th><th class="nw">Created By</th>');
 return addAfterHead(h,flow(1));
};

/* ③ Purchase: only bills whose weighment is closed */

<script>
/* ===== V17: Unloading Location · Charges/TDS/Broker in Weigh Bridge · Vehicle documents (RC, PAN, TDS, Bank Passbook, Other) ===== */
(()=>{
const vn=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const vMeta=v=>{const k=vn(v);return k?(db.vehicles||[]).find(x=>vn(x.name)===k):null};
const vMake=v=>{let m=vMeta(v);if(!m){m={name:String(v).trim().toUpperCase()};db.vehicles.push(m)}return m};
const hasDoc=(v,t)=>{const m=vMeta(v);return !!(m&&m.docs&&m.docs[t])};

const canDel=()=>!!current&&(current.role==='Admin'||current.role==='Manager');
const fsz=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const nowS=()=>new Date().toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});

/* ---- file storage: IndexedDB (files) + details in db.vehicles[].docs ---- */
const idb2=()=>new Promise((res,rej)=>{const r=indexedDB.open('tsr_erp_docs',1);r.onupgradeneeded=()=>r.result.createObjectStore('d',{keyPath:'k'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(mode,fn)=>{const d=await idb2();return new Promise((res,rej)=>{const t=d.transaction('d',mode);const q=fn(t.objectStore('d'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const dPut=o=>tx('readwrite',s=>s.put(o)),dGet=k=>tx('readonly',s=>s.get(k)),dDel=k=>tx('readwrite',s=>s.delete(k));
const shrink=f=>new Promise(res=>{
 if(!/^image\//.test(f.type)||f.size<700*1024)return res(f);
 const img=new Image(),u=URL.createObjectURL(f);
 img.onload=()=>{const s=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  c.toBlob(b=>{URL.revokeObjectURL(u);res(b&&b.size<f.size?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f)},'image/jpeg',.82)};
 img.onerror=()=>{URL.revokeObjectURL(u);res(f)};img.src=u});
const putDoc=async(veh,type,file)=>{
 if(!/^(image\/|application\/pdf)/.test(file.type)&&!/\.(pdf|png|jpe?g)$/i.test(file.name)){alert('Only PNG, JPG, JPEG or PDF files are allowed.');return false}
 file=await shrink(file);
 if(file.size>10*1048576){alert('File is too large (max 10 MB).');return false}
 const m=vMake(veh);
 await dPut({k:vn(veh)+'|'+type,blob:file,name:file.name,mime:file.type||'application/octet-stream'});
 m.docs=m.docs||{};m.docs[type]={name:file.name,size:file.size,mime:file.type,at:nowS()};

const docCard=async(veh,t,l)=>{const r=await dGet(vn(veh)+'|'+t);if(!r)return '<div class="card" style="margin-top:10px"><b>'+l+'</b><p class="muted">File not found on this device.</p></div>';
 const u=URL.createObjectURL(r.blob);urls.push(u);const img=/^image\//.test(r.mime);
 return '<div class="card" style="margin-top:10px"><b>'+l+'</b> <small class="muted">'+esc(r.name)+'</small><div style="margin-top:8px">'+(img?'<a href="'+u+'" target="_blank"><img src="'+u+'" style="max-width:100%;border-radius:8px;border:1px solid #ddd"></a>':'<div style="font-size:40px">📄</div>')+'</div><div class="actions"><a href="'+u+'" target="_blank" style="text-decoration:none"><button class="secondary" type="button">↗ Open</button></a><a href="'+u+'" download="'+esc(r.name)+'" style="text-decoration:none"><button class="secondary" type="button">⬇ Download</button></a></div></div>'};
const showModal=async(veh,types)=>{docClose();const m=vMeta(veh);
 const o=document.createElement('div');o.id='docm';o.style.cssText='position:fixed;inset:0;background:#0008;z-index:99;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px';
 o.innerHTML='<div class="card" style="width:min(760px,100%)"><div class="pagehead" style="margin:0"><h2 style="margin:0">📂 Documents – '+esc(m?m.name:veh)+'</h2><button class="secondary" onclick="docClose()">Close</button></div><div id="docmb"><p class="muted">Loading…</p></div></div>';
 document.body.appendChild(o);
 const parts=[];for(const [k,l] of types)if(m&&m.docs&&m.docs[k])parts.push(await docCard(veh,k,l));
 document.getElementById('docmb').innerHTML=parts.length?parts.join(''):'<p class="muted">No documents uploaded for this vehicle yet.</p>'};
window.docView=(v,t)=>{v=decodeURIComponent(v);showModal(v,DT.filter(x=>x[0]===t).map(x=>[x[0],x[1]]))};

window.docRemove=async(v,t)=>{v=decodeURIComponent(v);if(!canDel()){alert('Only Manager / Admin can remove a document.');return}
 if(!confirm('Remove this document?'))return;const m=vMeta(v);if(!m)return;await dDel(vn(v)+'|'+t);if(m.docs)delete m.docs[t];audit('Vehicle document removed',m.name+' · '+t);save();

/* ---- Document Upload card (Weigh Bridge) ---- */
const docInner=veh=>{
 if(!String(veh||'').trim())return '<p class="muted">Enter a vehicle number to check document status.</p>';

  return '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee"><div style="flex:1 1 150px"><b>'+l+'</b> '+(rq?'<small style="color:#b42318">(required)</small>':'<small class="muted">(optional)</small>')+'</div><div style="flex:2 1 190px">'+(d?'<span style="color:#067647">✔ '+esc(d.name)+'</span> <small class="muted">'+fsz(d.size)+' · '+esc(d.at)+'</small>':'<span class="muted">— Not uploaded</span>')+'</div><div class="actions" style="margin:0"><input type="file" id="df_'+k+'" accept="image/*,application/pdf" style="display:none" onchange="docUp(\''+k+'\',this)"><button type="button" class="secondary" onclick="Q(\'df_'+k+'\').click()">⬆ '+(d?'Replace':'Upload')+'</button>'+(d?'<button type="button" class="secondary" onclick="docView(\''+ev+'\',\''+k+'\')">👁 View</button>':'')+(d&&canDel()?'<button type="button" class="danger" onclick="docRemove(\''+ev+'\',\''+k+'\')">🗑</button>':'')+'</div></div>'}).join('')+'</div>'+
  '<p style="margin:10px 0 0;font-weight:700;color:'+(miss?'#b42318':'#067647')+'">'+(miss?'⚠ Vehicle RC is not uploaded – weighment cannot be saved.':'✔ Required document (RC) uploaded.')+'</p>'+
  '<div class="actions"><button type="button" onclick="docViewAll(\''+ev+'\')">📂 View All Documents</button></div>'};
window.dbxRefresh=()=>{const b=document.getElementById('docbox'),d=document.getElementById('dvh');if(b&&d)b.innerHTML=docInner(d.value)};

(()=>{

  '<div style="display:flex;justify-content:space-between;gap:20px;padding:6px 0 0;margin-top:4px;border-top:2px solid #522295;font-size:16px"><span>Net Payable (after Other Deductions &amp; Draft Commission)</span><b id="pnet" style="color:#341857">₹0</b></div></div>');

<script>
/* ===== V19: Gate Entry – no Purchase Serial (Gate Entry Auto first) · Unloading Date auto, Bill Date empty · type-in calculator (no buttons) ===== */
(()=>{
const _G=V['Gate Entry'];
V['Gate Entry']=()=>{
 let h=_G();
 const sm=/<div class="field"><label>Purchase Serial No\.<\/label><input id="serial"[^>]*><\/div>/.exec(h);
 if(sm){const sv=/value="([^"]*)"/.exec(sm[0]);h=h.replace(sm[0],'<input id="serial" type="hidden" value="'+(sv?sv[1]:'')+'">')}
 const gm=/<div class="field"><label>Gate Entry No\. \(Auto\)<\/label><input id="gate"[^>]*><\/div>/.exec(h);
 if(gm){h=h.replace(gm[0],'');h=h.replace('<div class="sec">Bill Details</div><div class="formgrid">','<div class="sec">Bill Details</div><div class="formgrid">'+gm[0])}
 h=h.replace(/<input id="date" type="date" value="[^"]*">/,'<input id="date" type="date">');
 h=h.replace('<input id="unloadDate" type="date">','<input id="unloadDate" type="date" value="'+today()+'">');
 
 return h};

/* ---------- type-in calculator (amount fields) ---------- */
const DP={weight:2,rate:10,amount:2,bags:0,pded:2,pcom:2};
const isEx=v=>/[+*\/×÷x()%=−,]|into|by|plus|minus|times|divide|multipl|upon|.-/i.test(String(v||''));
const evalExpr=s=>{let i=0;const bad=()=>{throw 0};
 const number=()=>{const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));if(!m)bad();i+=m[1].length;return parseFloat(m[1])};
 const primary=()=>{let v;if(s[i]==='('){i++;v=expr();if(s[i]!==')')bad();i++}else v=number();while(s[i]==='%'){i++;v/=100}return v};
 const factor=()=>{if(s[i]==='-'){i++;return -factor()}if(s[i]==='+'){i++;return factor()}return primary()};
 const term=()=>{let v=factor();while(s[i]==='*'||s[i]==='/'){const o=s[i++],r=factor();v=o==='*'?v*r:v/r}return v};
 const expr=()=>{let v=term();while(s[i]==='+'||s[i]==='-'){const o=s[i++],r=term();v=o==='+'?v+r:v-r}return v};
 const v=expr();if(i!==s.length)bad();return v};
const calc=s=>{s=String(s).toLowerCase().replace(/divided\s*by|divide|upon|÷|by/g,'/').replace(/multiplied\s*by|multiply|times|into|[×x]/g,'*').replace(/plus/g,'+').replace(/minus|−/g,'-').replace(/[,=\s]/g,'');
 if(!s||!/^[0-9+\-*\/().%]+$/.test(s))return null;
 try{const v=evalExpr(s);return Number.isFinite(v)?v:null}catch(e){return null}};
const hasOp=v=>/[+*\/×÷x%(]|into|by|plus|minus|times|divide|multipl|upon|.-/i.test(String(v||''));
const fmt=(v,d)=>String(+v.toFixed(d));
const refreshAfter=el=>{if(el.id==='pded'||el.id==='pcom'){if(window.payCalc)payCalc()}else if(window.pc)pc(el.id)};
function commit(el){clearTimeout(el._t);if(!isEx(el.value))return;const v=calc(el.value);
 if(v===null)return;
 el.style.outline='';el.value=fmt(v,DP[el.id]??2);refreshAfter(el)}
const commitAll=()=>Object.keys(DP).forEach(i=>{const e=document.getElementById(i);if(e&&e._calc)commit(e)});
const attach=()=>{if(section!=='Gate Entry'&&section!=='Purchase')return;
 Object.keys(DP).forEach(id=>{const el=document.getElementById(id);if(!el||el._calc)return;el._calc=1;
  el.type='text';el.setAttribute('inputmode','text');el.removeAttribute('step');el.autocomplete='off';
  el.addEventListener('input',()=>{clearTimeout(el._t);
   if(/=\s*$/.test(el.value)){el.value=el.value.replace(/=+\s*$/,'');commit(el);return}
   if(hasOp(el.value)&&/[0-9)%]\s*$/.test(el.value)&&calc(el.value)!==null)el._t=setTimeout(()=>{if(document.getElementById(el.id)===el&&hasOp(el.value))commit(el)},1200)});
  el.addEventListener('change',()=>commit(el));
  el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit(el)}})})};
const _pc=window.pc;
window.pc=function(s){if(['weight','rate','amount'].some(i=>{const e=document.getElementById(i);return e&&isEx(e.value)}))return;if(_pc)_pc(s)};
const _sb=window.saveBill;window.saveBill=function(t){commitAll();return _sb(t)};
const _ga=window.genAdvice;window.genAdvice=function(){commitAll();return _ga()};
const _r=window.render;
window.render=function(k){_r(k);setTimeout(attach,0)};
setTimeout(attach,0);
})();
</script>

<script>
/* ===== V22: Weigh Bridge – signed weight difference (no "Final – Bill Weight"); Purchase shows weighed bills waiting to be closed; accurate Rate / Amount ===== */

const sg=v=>v>0?'+'+n0(v):v<0?'-'+n0(-v):'0';

const isClosed=w=>!!w&&w.closed!==false;
const ready=p=>p.wb!=='Pending'&&(!wOf(p)||isClosed(wOf(p)));

/* ---- Weigh Bridge (Inward): Net Shortage / Deduction = Weighbridge weight − Bill weight, with + / − ---- */
const _W=window.weighbridge;
window.weighbridge=function(){
 let h=_W();
 if(!h.includes('Weigh Bridge – Inward (Gate Entry)'))return h;
 const gm=/Gate Entry (GE-\d+) – Purchase Bill Details/.exec(h),p=gm?db.purchases.find(x=>x.gate===gm[1]):null;
 h=h.replace(/<div class="field"><label>Final [–−-] Bill Weight \(KG\)<\/label><input id="wdif"[^>]*><\/div>/,'');

 h=h.replace('<label>Net Shortage / Deduction (KG)</label>','<label>Net Shortage / Deduction (KG) <small style="text-transform:none;font-weight:400">( + more than bill · − less than bill )</small></label>');
 setTimeout(()=>{if(window.wbCalc)wbCalc()},0);
 return h;
};
window.wbCalc=function(){
 const v=id=>document.getElementById(id);
 if(v('wtf'))v('wtf').value=((+val('wfa')||0)-(+val('wadv')||0)-(+val('wftds')||0)).toFixed(2);
 if(!v('wnet'))return;
 const g=+val('wgr')||0,t=+val('wta')||0,bw=+val('wbill')||0,ok=g>t,n=g-t;
 v('wnet').value=ok?n.toFixed(2):'';if(v('wfin'))v('wfin').value=ok?n.toFixed(2):'';
 if(v('wsh')){if(ok&&bw>0){const d=+(n-bw).toFixed(2);v('wsh').value=d>0?'+'+d:d<0?'-'+Math.abs(d):'0'}else v('wsh').value=''}
};

 try{return _ws()}finally{if(document.getElementById('wsh')&&window.wbCalc)wbCalc()}
};

 let h=_P();
 const W=db.purchases.filter(x=>x.wb!=='Pending'&&!ready(x));

<script>
/* ===== V28: Sales ▸ New Customer Order Entry (one order, many customers) ===== */

const csnNums=x=>(String(x||'').match(/\d+/g)||[]).map(Number);
const maxCsn=()=>{const a=[];orders().forEach(o=>a.push(...csnNums(o.csn)));trash().forEach(t=>{if(t.order)a.push(...csnNums(t.order.csn));if(t.wbf)a.push(...csnNums(t.wbf.csn))});(db.wbf||[]).forEach(x=>a.push(...csnNums(x.csn)));return Math.max(0,...a)};
window.__csn=()=>String(maxCsn()+1);
window.csnEnsure=()=>{let ch=false;[...orders()].sort((a,b)=>(a.id||0)-(b.id||0)).forEach(o=>{if(!o.csn){o.csn=window.__csn();ch=true}});if(ch)save()};
const sums=()=>({tons:r3(OR.lines.reduce((n,l)=>n+tonsOf(l),0)),bags:OR.lines.reduce((n,l)=>n+(+l.bags||0),0)});

const gids=()=>[...new Set(OR.lines.map(l=>l.g))];
const nb=l=>l.item||l.bags||l.bagKg;
const gRows=g=>OR.lines.map((l,i)=>({l,i})).filter(x=>x.l.g===g);
const gTons=g=>r3(gRows(g).reduce((n,x)=>n+tonsOf(x.l),0));
const lineHtml=(g,gi)=>{
 const R=gRows(g),f=R[0],many=R.length>1;
 const rows=R.map((x,k)=>`<tr><td style="color:#896fbb">${k+1}</td>
<td><div class="inl"><input id="ori_${x.i}" list="dl_ori" value="${esc(x.l.item)}" placeholder="Select from master" autocomplete="off" oninput="orSet(${x.i},'item',this.value)" style="min-width:150px"><button type="button" class="addb" onclick="orAddItem(${x.i})">+<br>Add</button></div></td>
<td><div class="inl"><input id="orb_${x.i}" list="dl_orb" value="${esc(x.l.bagKg)}" inputmode="decimal" placeholder="e.g. 50" autocomplete="off" oninput="orSet(${x.i},'bagKg',this.value)" style="min-width:90px"><button type="button" class="addb" onclick="orAddBag(${x.i})">+<br>Add</button></div></td>
<td><input id="orn_${x.i}" type="number" min="0" step="1" value="${esc(x.l.bags)}" placeholder="0" oninput="orSet(${x.i},'bags',this.value)" style="min-width:90px"></td>
<td><input id="ort_${x.i}" class="readonly" readonly value="${n0(tonsOf(x.l))}" style="font-weight:700;min-width:80px"></td>
<td><input value="${esc(x.l.remarks)}" placeholder="Optional" oninput="orSet(${x.i},'remarks',this.value)" style="min-width:110px"></td>
